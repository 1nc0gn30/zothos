# ═══════════════════════════════════════════════════════════════════════════════
#  ZOTHOS LIGHTDM SLICK GREETER CONFIGURATION
#  Hermetic Matrix Glassmorphism + 4K Master Backdrop + 3D Golden Azoth Avatar
# ═══════════════════════════════════════════════════════════════════════════════

[Greeter]
background=/usr/share/backgrounds/zothos/hermetic-matrix.png
theme-name=Zoth-Hermetic-Matrix
icon-theme-name=Zoth-Hermetic
font-name=JetBrains Mono Medium 11
draw-user-backgrounds=false
draw-grid=false
show-hostname=true
show-clock=true
clock-format=%a, %d %b %Y  •  %H:%M:%S
logo=/usr/share/pixmaps/zoth-studio.png
default-user-avatar=/usr/share/pixmaps/zoth-studio.png
enable-hidpi=auto
