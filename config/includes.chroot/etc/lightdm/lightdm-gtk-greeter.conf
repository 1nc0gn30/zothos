# ═══════════════════════════════════════════════════════════════════════════════
#  ZOTHOS LIGHTDM GTK GREETER CONFIGURATION
#  Hermetic Matrix Glassmorphism + 4K Master Backdrop + 3D Golden Azoth Avatar
# ═══════════════════════════════════════════════════════════════════════════════

[greeter]
background = /usr/share/backgrounds/zothos/zothos-field.png
theme-name = Zoth-Hermetic-Matrix
icon-theme-name = Zoth-Hermetic
font-name = Hack 11
user-background = false
hide-user-image = false
default-user-image = /usr/share/pixmaps/zoth-studio.png
screensaver-timeout = 0
indicators = ~host;~spacer;~clock;~spacer;~session;~language;~a11y;~power
clock-format = %a, %d %b %Y  •  %H:%M:%S
position = 50%,center 50%,center
panel-position = top
active-monitor = #primary
xft-antialias = true
xft-dpi = 96
xft-hintstyle = hintslight
xft-rgba = rgb
