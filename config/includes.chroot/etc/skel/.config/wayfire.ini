# ==============================================================================
#  ZOTHOS WAYFIRE 3D & MOTION WAYLAND COMPOSITOR CONFIGURATION
# ==============================================================================

[core]
plugins = alpha animate autostart blur command cube expo fast-switcher grid idle move place resize vswitch window-rules wobbly wm-actions
close_top_view = <super> KEY_Q
focus_button_with_modifiers = true
vwidth = 3
vheight = 3

[animate]
open_animation = zoom
close_animation = zoom
duration = 280
enabled_for = (type is "toplevel" | (type is "x-or" & focuseable is true))
fade_duration = 250
zoom_duration = 280

[blur]
method = kawase
kawase_passes = 3
kawase_offset = 2.0
blur_by_default = all

[wobbly]
friction = 3.0
spring_k = 8.0
grid_resolution = 6

[cube]
activate = <super> <ctrl> KEY_C
initial_animation = 300
speed_spin_horiz = 0.02
speed_spin_vert = 0.02

[expo]
toggle = <super> KEY_E
duration = 300
offset = 10

[decoration]
border_size = 2
active_color = 0.0 1.0 0.53 0.9
inactive_color = 0.06 0.1 0.13 0.6
font = JetBrainsMono Nerd Font

[autostart]
background = swaybg -i /usr/share/backgrounds/zothos/hermetic-matrix.png -m fill
bar = waybar
desktop_init = zoth-desktop-init
portal = /usr/lib/xdg-desktop-portal & /usr/lib/xdg-desktop-portal-wlr &

[command]
binding_term = <super> KEY_ENTER
command_term = alacritty || foot || xfce4-terminal

binding_launcher = <super> KEY_SPACE
command_launcher = wofi --show drun

binding_files = <super> KEY_F
command_files = thunar

binding_cockpit = <super> KEY_Z
command_cockpit = alacritty -t "Zoth Cockpit" -e zoth-cockpit || foot -T "Zoth Cockpit" zoth-cockpit

binding_agent = <super> KEY_A
command_agent = zoth-agent-hud

binding_ghost = <super> KEY_G
command_ghost = zoth-ghost --toggle

binding_netkill = <super> KEY_K
command_netkill = zoth-netkill --toggle

binding_lock = <super> KEY_L
command_lock = swaylock -f -c 0a0f14 -i /usr/share/backgrounds/zothos/hermetic-matrix.png

[input]
natural_scroll = true
tap_to_click = true
drag_lock = true

[output:Virtual-1]
mode = 1280x800@60000
position = 0,0
transform = normal
