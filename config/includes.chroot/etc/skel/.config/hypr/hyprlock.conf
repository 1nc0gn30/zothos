# ==============================================================================
#  ZOTHOS HYPRLOCK CONFIGURATION (Alchemical Security Shield)
# ==============================================================================

background {
    monitor =
    path = /usr/share/backgrounds/zothos/hermetic-matrix.png
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.3 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 255, 136, 0.8)
    inner_color = rgba(10, 15, 20, 0.75)
    font_color = rgb(0, 255, 136)
    fade_on_empty = false
    placeholder_text = <span foreground="##00ff8888">AUTHENTICATE OPERATOR...</span>
    hide_input = false
    check_color = rgb(0, 229, 255)
    fail_color = rgb(255, 50, 50)
    fail_text = <i>ACCESS DENIED ($ATTEMPTS)</i>
    position = 0, -80
    halign = center
    valign = center
}

# Current Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = rgb(0, 255, 136)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 255, 136, 0.4)
}

# Date & Host Information
label {
    monitor =
    text = cmd[update:10000] echo "$(date +"%A, %d %B %Y") | ZOTH-SEC-L4"
    color = rgba(160, 200, 220, 0.8)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}
