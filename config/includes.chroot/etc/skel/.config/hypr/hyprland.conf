# ==============================================================================
#  ZOTHOS APEX WAYLAND COMPOSITOR CONFIGURATION (Hyprland v0.40+)
#  Theme: Hermetic Matrix / Glassmorphism / Bezier Spring Dynamics
# ==============================================================================

# Monitor configuration (Automatic resolution & refresh rate detection)
monitor=,preferred,auto,1

# ------------------------------------------------------------------------------
# AUTOSTART ESSENTIAL DAEMONS & HUD SERVICES
# ------------------------------------------------------------------------------
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1 || /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = waybar
exec-once = swaync
exec-once = hyprpaper
exec-once = hypridle
exec-once = zoth-desktop-init
exec-once = zoth-arsenal-sync --quiet &

# Set environment variables for Wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ------------------------------------------------------------------------------
# INPUT DEVICES CONFIGURATION
# ------------------------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
}

# ------------------------------------------------------------------------------
# GENERAL AESTHETICS & LAYOUT
# ------------------------------------------------------------------------------
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2

    # Animated neon emerald to cyan to gold gradient border
    col.active_border = rgba(00ff88ee) rgba(00e5ffee) rgba(ffd700ee) 45deg
    col.inactive_border = rgba(101b22aa)

    layout = dwindle
    allow_tearing = false
}

# ------------------------------------------------------------------------------
# DECORATIONS: FROSTED GLASS DUAL-KAWASE BLUR & SHADOWS
# ------------------------------------------------------------------------------
decoration {
    rounding = 12

    active_opacity = 0.94
    inactive_opacity = 0.84
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.015
        contrast = 1.05
        brightness = 1.0
        vibrancy = 0.35
        vibrancy_darkness = 0.2
        popups = true
    }

    shadow {
        enabled = true
        range = 24
        render_power = 4
        color = rgba(00ff8833)
        color_inactive = rgba(00000066)
    }
}

# ------------------------------------------------------------------------------
# ADVANCED BEZIER ANIMATIONS (Snappy Spring Dynamics)
# ------------------------------------------------------------------------------
animations {
    enabled = true

    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = bounce, 0.2, 1.2, 0.2, 1.0
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = linear, 0, 0, 1, 1

    # Windows animation
    animation = windows, 1, 4.5, wind, slide
    animation = windowsIn, 1, 4.5, winIn, slide
    animation = windowsOut, 1, 3.5, winOut, slide
    animation = windowsMove, 1, 4, wind, slide

    # Border glow rotation
    animation = border, 1, 1, linear
    animation = borderangle, 1, 120, linear, loop

    # Fade & workspace slide
    animation = fade, 1, 5, smoothIn
    animation = fadeOut, 1, 4, smoothOut
    animation = workspaces, 1, 5.5, wind, slidevert
    animation = specialWorkspace, 1, 5, bounce, slidevert
}

# ------------------------------------------------------------------------------
# LAYOUT SPECIFICATIONS
# ------------------------------------------------------------------------------
dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    vrr = 1
}

# ------------------------------------------------------------------------------
# WINDOW RULES FOR SECURITY, TERMINALS, & HUDS
# ------------------------------------------------------------------------------
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(org.gnome.Calculator)$
windowrulev2 = float, title:^(Zoth Cockpit)$
windowrulev2 = float, title:^(ZOTH AGENT HUD)$
windowrulev2 = size 1000 650, title:^(Zoth Cockpit)$
windowrulev2 = center, title:^(Zoth Cockpit)$
windowrulev2 = opacity 0.95 0.88, class:^(kitty)$
windowrulev2 = opacity 0.95 0.88, class:^(Alacritty)$
windowrulev2 = opacity 0.98 0.95, class:^(firefox)$
windowrulev2 = opacity 0.98 0.95, class:^(Chromium)$

# ------------------------------------------------------------------------------
# KEYBINDINGS & SHORTCUTS
# ------------------------------------------------------------------------------
$mainMod = SUPER

# Applications & Terminal
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Space, exec, wofi --show drun --prompt "ZOTH SEARCH >"
bind = $mainMod, E, exec, thunar
bind = $mainMod, B, exec, firefox-esr || chromium

# ZOTHOS Autonomous Tools & Cockpits
bind = $mainMod, Z, exec, kitty --title "Zoth Cockpit" -e zoth-cockpit
bind = $mainMod, A, exec, zoth-agent-hud
bind = $mainMod, G, exec, zoth-ghost --toggle
bind = $mainMod, U, exec, zoth-undercover --toggle
bind = $mainMod, K, exec, zoth-netkill --toggle

# Window Management
bind = $mainMod, Q, killactive,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, N, exec, swaync-client -t -sw

# Screenshot (Grim + Slurp to clipboard)
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Area copied to clipboard"
bind = , Print, exec, grim - | wl-copy && notify-send "Screenshot" "Full screen copied to clipboard"

# Focus Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Workspaces Navigation (1-10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace (1-10)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scratchpad Special Workspace
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, M, movetoworkspace, special:magic

# Mouse Bindings (Drag to move, Right-click to resize)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume & Media Keys
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binde = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
