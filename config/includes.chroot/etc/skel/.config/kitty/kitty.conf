# =============================================================================
#  ZOTHOS KITTY GPU TERMINAL CONFIGURATION
# =============================================================================

# Font Configuration
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size 12.0

# Window Opacity & Blur
background_opacity 0.86
dynamic_background_opacity yes
window_padding_width 12
confirm_os_window_close 0

# Cursor
cursor #00ff88
cursor_text_color #050b10
cursor_shape beam
cursor_beam_thickness 2
cursor_blink_interval 0.5
cursor_trail 3

# Hermetic Matrix Cyberpunk Palette
foreground #d0f0e0
background #0a0f14
selection_foreground #050b10
selection_background #00ff88

# Black
color0 #101b22
color8 #263842

# Red
color1 #ff3366
color9 #ff5588

# Green (Emerald Glow)
color2  #00ff88
color10 #33ffaa

# Yellow (Alchemical Gold)
color3  #ffd700
color11 #ffe033

# Blue (Cyan Matrix)
color4  #00d2ff
color12 #33e0ff

# Magenta (Ether Purple)
color5  #9d4edd
color13 #c77dff

# Cyan
color6  #00e5ff
color14 #55eeff

# White
color7  #e0f8ff
color15 #ffffff

# Keybindings
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
