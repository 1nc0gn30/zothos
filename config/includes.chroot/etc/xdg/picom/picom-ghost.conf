# ==============================================================================
#  ZOTHOS PICOM COMPOSITOR SPECIFICATION
#  Reality: NullAI Ghostmode Stealth
#  Theme: Stealth Void, Deep Violet Ambient Occlusion & Zero-Lag Compositing
# ==============================================================================

backend = "xrender";
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true;
vsync = false;
log-level = "warn";
inactive-opacity-override = false;

# ── Stealth Shadows ───────────────────────────────────────────────────────────
shadow = true;
shadow-radius = 18;
shadow-offset-x = -14;
shadow-offset-y = -12;
shadow-opacity = 0.75;
shadow-color = "#08020e";
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "_GTK_FRAME_EXTENTS@:c",
    "class_g = 'xfce4-panel'",
    "window_type = 'desktop'",
    "window_type = 'dock'"
];

# ── Fading ────────────────────────────────────────────────────────────────────
fading = true;
fade-in-step  = 0.10;
fade-out-step = 0.10;
fade-delta    = 3;
fade-exclude  = [];

# ── Opacity & Glass ───────────────────────────────────────────────────────────
active-opacity = 1.0;
inactive-opacity = 0.90;
frame-opacity = 1.0;
opacity-rule = [
    "100:class_g = 'xfce4-terminal'",
    "100:class_g = 'kitty'",
    "100:class_g = 'Alacritty'",
    "100:class_g = 'firefox'",
    "100:class_g = 'Chromium'",
    "100:window_type = 'desktop'",
    "100:window_type = 'dock'"
];

blur-background = false;
corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "class_g = 'xfce4-panel'"
];

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

wintypes:
{
    tooltip         = { fade = true; shadow = false; opacity = 0.95; focus = true; };
    dnd             = { shadow = false; };
    popup_menu      = { opacity = 0.98; shadow = true; };
    dropdown_menu   = { opacity = 0.98; shadow = true; };
    utility         = { shadow = false; };
    dialog          = { shadow = true; };
    dock            = { shadow = false; };
    desktop         = { shadow = false; };
    notification    = { shadow = false; };
}
