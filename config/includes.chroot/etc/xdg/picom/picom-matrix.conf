# ═══════════════════════════════════════════════════════════════════════════════
#  ZOTHOS APEX PICOM COMPOSITOR — HERMETIC MATRIX ULTRA-LEAN v3.5
#  Fast, responsive, zero CPU spike, hardware shadows, rounded corners & neon iris
# ═══════════════════════════════════════════════════════════════════════════════

# ── Backend ───────────────────────────────────────────────────────────────────
backend = "xrender";
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true;
vsync = false;
log-level = "warn";
inactive-opacity-override = false;

# ── Shadows: Crisp Cyberpunk Phosphor Depth ──────────────────────────────────
shadow = true;
shadow-radius = 16;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-opacity = 0.65;
shadow-color = "#000000";
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "_GTK_FRAME_EXTENTS@:c",
    "class_g = 'xfce4-panel'",
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "class_g = 'xfce4-terminal'",
    "class_g = 'kitty'",
    "class_g = 'Alacritty'"
];

# ── Fading: Fast Neon Persistence ─────────────────────────────────────────────
fading = true;
fade-in-step  = 0.08;
fade-out-step = 0.08;
fade-delta    = 4;
fade-exclude  = [];

# ── Opacity: Clear Glass & Terminal Focus ─────────────────────────────────────
active-opacity = 1.0;
inactive-opacity = 0.92;
frame-opacity = 1.0;
opacity-rule = [
    "100:class_g = 'xfce4-terminal'",
    "100:class_g = 'URxvt'",
    "100:class_g = 'kitty'",
    "100:class_g = 'Alacritty'",
    "100:class_g = 'firefox'",
    "100:class_g = 'Chromium'",
    "100:class_g = 'google-chrome'",
    "100:class_g = 'vlc'",
    "100:class_g = 'burpsuite'",
    "100:class_g = 'caido'",
    "100:window_type = 'desktop'",
    "100:window_type = 'dock'"
];

# ── Blur: Lightweight / Safe for Software Rasterizers & VMs ───────────────────
blur-background = false;

# ── Rounded Corners: Anti-Aliased Glass Edges ─────────────────────────────────
corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "class_g = 'xfce4-panel'",
    "class_g = 'xfce4-terminal'",
    "class_g = 'kitty'",
    "class_g = 'Alacritty'"
];

# ── Focus & Window Detection ──────────────────────────────────────────────────
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
glx-no-rebind-pixmap = true;

# ── Window Type Rules ─────────────────────────────────────────────────────────
wintypes:
{
    tooltip         = { fade = true; shadow = false; opacity = 0.95; focus = true; };
    dnd             = { shadow = false; };
    popup_menu      = { opacity = 0.98; shadow = true; };
    dropdown_menu   = { opacity = 0.98; shadow = true; };
    utility         = { shadow = false; };
    dialog          = { shadow = true; };
    dock            = { shadow = false; };
    desktop         = { shadow = false; };
    notification    = { shadow = false; };
}
