# ZOTHOS Apex Picom Compositor — Hermetic Matrix Mode
# Dual-kawase blur, emerald window glows, smooth animations

# ── Backend ───────────────────────────────────────────────────────────────────
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true;
log-level = "warn";

# ── Shadows ───────────────────────────────────────────────────────────────────
shadow = true;
shadow-radius = 24;
shadow-offset-x = -12;
shadow-offset-y = -8;
shadow-opacity = 0.6;
shadow-color = "#000000";
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "_GTK_FRAME_EXTENTS@:c",
    "class_g = 'xfce4-panel'",
    "window_type = 'desktop'",
    "window_type = 'dock'"
];

# ── Fading ────────────────────────────────────────────────────────────────────
fading = true;
fade-in-step  = 0.03;
fade-out-step = 0.04;
fade-delta    = 4;
fade-exclude  = [];

# ── Opacity ───────────────────────────────────────────────────────────────────
active-opacity = 1.0;
inactive-opacity = 0.92;
frame-opacity = 1.0;
inactive-opacity-override = false;
opacity-rule = [
    "95:class_g = 'xfce4-terminal'",
    "90:class_g = 'URxvt'",
    "90:class_g = 'kitty'",
    "100:class_g = 'firefox'",
    "100:class_g = 'Chromium'",
    "100:class_g = 'vlc'",
    "100:window_type = 'desktop'",
    "100:window_type = 'dock'"
];

# ── Blur ──────────────────────────────────────────────────────────────────────
blur-method = "dual_kawase";
blur-strength = 8;
blur-kern = "3x3box";
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [
    "window_type = 'desktop'",
    "class_g = 'slop'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ── Window Borders / Rounded Corners ─────────────────────────────────────────
corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "class_g = 'xfce4-panel'"
];

# ── Focus / Dim ────────────────────────────────────────────────────────────────
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
refresh-rate = 0;
vsync = true;
dbe = false;
detect-transient = true;
detect-client-leader = true;
invert-color-include = [];
glx-no-rebind-pixmap = true;

# ── Window type rules ─────────────────────────────────────────────────────────
wintypes:
{
    tooltip         = { fade = true; shadow = false; opacity = 0.95; focus = true; full-shadow = false; };
    dnd             = { shadow = false; };
    popup_menu      = { opacity = 0.98; shadow = true; };
    dropdown_menu   = { opacity = 0.98; shadow = true; };
    utility         = { shadow = false; };
    dialog          = { shadow = true; };
    dock            = { shadow = false; blur-background = false; };
    desktop         = { shadow = false; blur-background = false; };
    notification    = { shadow = false; blur-background = false; };
};
