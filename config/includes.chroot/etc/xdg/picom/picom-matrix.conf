# ═══════════════════════════════════════════════════════════════════════════════
#  ZOTHOS APEX PICOM COMPOSITOR — HERMETIC MATRIX MODE v3.0
#  Volumetric glassmorphism, CRT phosphor bleed, scanline overlay, neon iris
#  Target: 2028-2030 cutting-edge cyberpunk desktop experience
# ═══════════════════════════════════════════════════════════════════════════════

# ── Backend ───────────────────────────────────────────────────────────────────
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true;
log-level = "warn";
inactive-opacity-override = false;

# ── Shadow: Volumetric emerald phosphor depth ────────────────────────────────
shadow = true;
shadow-radius = 32;          # Deep volumetric shadow
shadow-offset-x = -16;
shadow-offset-y = -12;
shadow-opacity = 0.78;
shadow-color = "#000000";
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "_GTK_FRAME_EXTENTS@:c",
    "class_g = 'xfce4-panel'",
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "class_g = 'xfce4-terminal'",
    "class_g = 'kitty'",
    "class_g = 'Alacritty'"
];

# ── Fading: Phosphor persistence ─────────────────────────────────────────────
fading = true;
fade-in-step  = 0.05;
fade-out-step = 0.06;
fade-delta    = 6;
fade-exclude  = [];

# ── Opacity: Crystal clarity for terminals & browsers ────────────────────────
active-opacity = 1.0;
inactive-opacity = 0.85;
frame-opacity = 1.0;
opacity-rule = [
    "100:class_g = 'xfce4-terminal'",
    "100:class_g = 'URxvt'",
    "100:class_g = 'kitty'",
    "100:class_g = 'Alacritty'",
    "100:class_g = 'firefox'",
    "100:class_g = 'Chromium'",
    "100:class_g = 'google-chrome'",
    "100:class_g = 'vlc'",
    "100:window_type = 'desktop'",
    "100:window_type = 'dock'"
];

# ═══════════════════════════════════════════════════════════════════════════════
#  VOLATILE GLASSMORPHISM — Matrix cyberpunk blur & depth
# ═══════════════════════════════════════════════════════════════════════════════

# ── Dual-kawase blur: Deep holographic glass ─────────────────────────────────
blur-method = "dual_kawase";
blur-strength = 12;          # Increased for deeper glass depth
blur-kern = "5x5box";
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [
    "window_type = 'desktop'",
    "class_g = 'slop'",
    "_GTK_FRAME_EXTENTS@:c",
    "class_g = 'xfce4-terminal'",
    "class_g = 'kitty'",
    "class_g = 'Alacritty'"
];

# ── Rounded corners: Frosted glass edge ──────────────────────────────────────
corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "class_g = 'xfce4-panel'",
    "class_g = 'xfce4-terminal'",
    "class_g = 'kitty'",
    "class_g = 'Alacritty'"
];

# ── Focus highlight: Neon iris glow ring ─────────────────────────────────────
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
invert-color-include = [];
glx-no-rebind-pixmap = true;

# ── Window type rules ─────────────────────────────────────────────────────────
wintypes:
{
    tooltip         = { fade = true; shadow = false; opacity = 0.95; focus = true; full-shadow = false; };
    dnd             = { shadow = false; };
    popup_menu      = { opacity = 0.98; shadow = true; };
    dropdown_menu   = { opacity = 0.98; shadow = true; };
    utility         = { shadow = false; };
    dialog          = { shadow = true; };
    dock            = { shadow = false; blur-background = false; };
    desktop         = { shadow = false; blur-background = false; };
    notification    = { shadow = false; blur-background = false; };
}

# ═══════════════════════════════════════════════════════════════════════════════
#  CRT SCANLINE OVERLAY SYSTEM
#  Generates a full-screen scanline overlay for authentic CRT phosphor feel.
#  Two modes: (1) picom-only simulation, (2) external overlay daemon.
# ═══════════════════════════════════════════════════════════════════════════════
#
#  METHOD 1 — Picom-only (enabled by default):
#    The aggressive dual-kawase blur + deep shadow creates a "phosphor bleed"
#    effect that mimics CRT screen glow without a separate overlay.
#
#  METHOD 2 — External CRT overlay (recommended for full effect):
#    Launch the scanline daemon BEFORE picom:
#      /usr/local/bin/zoth-crt-overlay start
#    This creates a transparent full-screen Y-overlapping window with
#    horizontal scanline stripes at 2px intervals, panel ratio 0.15,
#    and a subtle screen curvature via alpha gradient.
#
#  To toggle:  zoth-crt-overlay toggle
#  To stop:    zoth-crt-overlay stop
#
#  The overlay runs at 99% opacity so it stays above all content but below
#  fullscreen video. It is excluded from picom shadows automatically.
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
#  NEON BORDER HIGHLIGHT SYSTEM
#  XFCE windows get a glowing emerald border on focus. Three layers:
#    1. GTK theme border-color: #00ff9d (hermetic-matrix gtk.css)
#    2. Picom shadow emphasis on focused windows (this file)
#    3. xfwm4 theme with emerald titlebar gradient (xfwm4/themerc)
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
#  PERFORMANCE NOTES
#  • blur-strength 12 + shadow-radius 32 = high GPU usage on integrated GPUs
#  • For low-end hardware, add:  blur-background = false;
#  • For VR-ready fluidity, add:  vsync = true;  (requires glx backend)
# ═══════════════════════════════════════════════════════════════════════════════
