# ==============================================================================
#  ZOTHOS PICOM COMPOSITOR SPECIFICATION
#  Reality: Hermetic Matrix (v1.0 Azoth Transmutation)
#  Theme: Emerald Phosphor, Dual-Kawase Glassmorphism & Cyberpunk Glaze
# ==============================================================================

#################################
#             Backend           #
#################################
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true;
vsync = true;

#################################
#     Emerald Border Glow       #
#################################
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.85;
shadow-offset-x = -18;
shadow-offset-y = -18;
shadow-color = "#00ff9d";

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#           Fading              #
#################################
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 6;
fade-exclude = [];

#################################
#   Transparency & Opacity      #
# (85% Opacity Terminal Windows)#
#################################
inactive-opacity = 0.95;
frame-opacity = 0.90;
inactive-opacity-override = false;
active-opacity = 1.0;

opacity-rule = [
  "85:class_g = 'Xfce4-terminal'",
  "85:class_g = 'xfce4-terminal'",
  "85:class_g = 'Alacritty'",
  "85:class_g = 'kitty'",
  "85:class_g = 'URxvt'",
  "85:class_g = 'Termite'",
  "85:class_g = 'st-256color'",
  "85:class_g = 'Tilix'",
  "85:class_g = 'cool-retro-term'",
  "90:class_g = 'Thunar'",
  "95:class_g = 'Zoth-Studio'"
];

#################################
#       Dual-Kawase Blur        #
#################################
blur: {
  method = "dual_kawase";
  strength = 6;
  deviation = 1.0;
  kernel = "11x11gaussian";
  background = true;
  background-frame = true;
  background-fixed = false;
};

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#       Rounded Corners         #
#################################
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
#       General Settings        #
#################################
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.90; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};
