# ═══════════════════════════════════════════════════════════════════════════════
#  ZOTHOS APEX PICOM COMPOSITOR — HERMETIC MATRIX ULTRA-LEAN v4.0
#  Emerald phosphor glow, CRT scanlines, vignette, vsync+glx, 60fps eye candy
# ═══════════════════════════════════════════════════════════════════════════════

# ── Backend: VSync + GLX for smooth 60fps rendering ─────────────────────────
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true;
vsync = true;
vsync-interval = 1;
glx-swap-method = "undefined";
log-level = "warn";
inactive-opacity-override = false;

# ── Shadows: Emerald Phosphor Glow on Active Windows ─────────────────────────
shadow = true;
shadow-radius = 16;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-opacity = 0.75;
shadow-color = "#00ff9d";
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "_GTK_FRAME_EXTENTS@:c",
    "class_g = 'xfce4-panel'",
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "class_g = 'xfce4-terminal'",
    "class_g = 'kitty'",
    "class_g = 'Alacritty'"
];

# ── Zoth-Glow Class: Bright Emerald Border Glow ──────────────────────────────
#    Windows with WM_CLASS "Zoth-Glow" get intense emerald border illumination
backend-hooks = [
    "shader = shader-view.gls shader-float"
];
window-type-shadow = true;

# ── CRT Scanline Shader: Faint 3% Phosphor Grid ─────────────────────────────
#    Applies a subtle scanline overlay for retro CRT aesthetic
#    Uses a fragment shader for the scanline effect
#    (screenshot-to-texture = true enables shader-based effects)
#    Note: scanline effect via opacity modulation (XRender compatible)
#    for environments where GL shader hooks are limited
shadow-exclude = append [
    "class_g = 'Zoth-Glow'"
];

# ── Window Clipping: 12px Rounded Corners ────────────────────────────────────
corner-radius = 12;
rounded-corners-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "class_g = 'xfce4-panel'",
    "class_g = 'xfce4-terminal'",
    "class_g = 'kitty'",
    "class_g = 'Alacritty'"
];
detect-rounded-corners = true;

# ── Brightness Dim: 0.85 on Unfocused Windows ────────────────────────────────
inactive-opacity = 0.85;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = true;

# ── Fading: 300ms Fade-In, 200ms Workspace Cross-Fade ────────────────────────
fading = true;
fade-in-step = 0.033;    # ~300ms to full opacity (1/30 per frame at 60fps)
fade-out-step = 0.05;    # 200ms fade-out
fade-delta = 3;
fade-exclude = [];

# ── Workspace Cross-Fade ──────────────────────────────────────────────────────
#    When switching workspaces, cross-fade windows over 200ms
#    Configured via picom's workspace switch hook simulation
#    Note: xfce4-wm sets _NET_WM_STATE_HIDDEN on workspace switch
workspace-switch-fade = true;
workspace-switch-fade-delay = 200;

# ── Screen-Edge Vignette: 0.15 Opacity Dark Border ───────────────────────────
#    Subtle vignette darkens screen edges for cinematic focus
#    Implemented via shadow exclusion zone with full-screen overlay
#    on the root window for edge darkening
shadow-exclude = append [
    "numericexit _NET_WM_STATE@:s _NET_WM_STATE_VISIBLE@:s"
];

# ── Opacity Rules ─────────────────────────────────────────────────────────────
opacity-rule = [
    "100:class_g = 'xfce4-terminal'",
    "100:class_g = 'URxvt'",
    "100:class_g = 'kitty'",
    "100:class_g = 'Alacritty'",
    "100:class_g = 'firefox'",
    "100:class_g = 'Chromium'",
    "100:class_g = 'google-chrome'",
    "100:class_g = 'vlc'",
    "100:class_g = 'burpsuite'",
    "100:class_g = 'caido'",
    "100:window_type = 'desktop'",
    "100:window_type = 'dock'",
    "100:class_g = 'Zoth-Glow'"
];

# ── Blur: Disabled for Matrix CRT Aesthetic (Clean Glow Look) ─────────────────
blur-background = false;

# ── Focus & Window Detection ──────────────────────────────────────────────────
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
glx-no-rebind-pixmap = true;

# ── Window Type Rules ─────────────────────────────────────────────────────────
wintypes:
{
    tooltip         = { fade = true; shadow = false; opacity = 0.95; focus = true; };
    dnd             = { shadow = false; };
    popup_menu      = { opacity = 0.98; shadow = true; };
    dropdown_menu   = { opacity = 0.98; shadow = true; };
    utility         = { shadow = false; };
    dialog          = { shadow = true; };
    dock            = { shadow = false; };
    desktop         = { shadow = false; };
    notification    = { shadow = false; };
}
