# ==============================================================================
#  ZOTHOS PICOM COMPOSITOR SPECIFICATION
#  Reality: Incognito Windows 11 (Corporate Chameleon Guise)
#  Theme: Fluent Acrylic Blur, Radius 8 Corners, Soft Diffuse Shadows
#  NO CRT EFFECTS — Clean Flat Modern Look
# ==============================================================================

#################################
#             Backend           #
#################################
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true;
vsync = true;
vsync-interval = 1;
glx-swap-method = "undefined";
log-level = "warn";
inactive-opacity-override = false;

#################################
#       Soft Drop Shadows       #
#      (Windows 11 Fluent)      #
#  Offset: 0 2px, Blur: 16px   #
#  Opacity: 0.15               #
#################################
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.15;
shadow-offset-x = 0;
shadow-offset-y = 2;
shadow-color = "#000000";

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#           Fading              #
#################################
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 5;
fade-exclude = [];

#################################
#   Transparency & Opacity      #
#################################
inactive-opacity = 0.98;
frame-opacity = 1.0;
active-opacity = 1.0;

opacity-rule = [
  "92:class_g = 'Xfce4-terminal'",
  "92:class_g = 'xfce4-terminal'",
  "96:class_g = 'Thunar'",
  "100:class_g = 'kitty'",
  "100:class_g = 'Alacritty'",
  "100:class_g = 'firefox'",
  "100:class_g = 'Chromium'"
];

#################################
#      Fluent Acrylic Blur      #
#   Radius: 20, Strength: 10   #
#   Mica Color Absorption       #
#################################
blur-background = true;
blur-background-radius = 20;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'xfce4-panel'"
];
blur-background-rotation = false;
blur-background-frame = true;

#################################
#     Subtle Rounded Corners    #
#           Radius: 8           #
#################################
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Xfce4-panel'",
  "class_g = 'xfce4-terminal'",
  "class_g = 'kitty'",
  "class_g = 'Alacritty'"
];
detect-rounded-corners = true;

#################################
#       General Settings        #
#################################
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
glx-no-rebind-pixmap = true;

#################################
#    Mica Color Absorption       #
#   (Adapts to wallpaper hues)  #
#################################
# Mica effect via native backend compositing
# Picom handles this via blur + opacity on unfocused windows
# keeping colors visible through translucent frame

#################################
#       Window Type Rules       #
#################################
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.98; shadow = true; };
  dropdown_menu = { opacity = 0.98; shadow = true; };
  utility = { shadow = false; };
  dialog = { shadow = true; };
  desktop = { shadow = false; };
  notification = { shadow = false; };
}
