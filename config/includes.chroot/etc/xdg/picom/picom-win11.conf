# ==============================================================================
#  ZOTHOS PICOM COMPOSITOR SPECIFICATION
#  Reality: Incognito Windows 11 (Corporate Chameleon Guise)
#  Theme: Fluent Acrylic Blur, Subtle Radius 8 Corners & Soft Diffuse Shadows
# ==============================================================================

#################################
#             Backend           #
#################################
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true;
vsync = true;

#################################
#       Soft Drop Shadows       #
#      (Windows 11 Fluent)      #
#################################
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-color = "#000000";

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#           Fading              #
#################################
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 5;
fade-exclude = [];

#################################
#   Transparency & Opacity      #
#################################
inactive-opacity = 0.98;
frame-opacity = 1.0;
inactive-opacity-override = false;
active-opacity = 1.0;

opacity-rule = [
  "92:class_g = 'Xfce4-terminal'",
  "92:class_g = 'xfce4-terminal'",
  "96:class_g = 'Thunar'"
];

#################################
#      Fluent Acrylic Blur      #
#################################
blur: {
  method = "dual_kawase";
  strength = 7;
  deviation = 1.2;
  background = true;
  background-frame = true;
  background-fixed = false;
};

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#     Subtle Rounded Corners    #
#           Radius: 8           #
#################################
corner-radius = 8;

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Xfce4-panel'"
];

#################################
#       General Settings        #
#################################
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.98; };
  dropdown_menu = { opacity = 0.98; };
};
