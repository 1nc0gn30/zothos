<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zoth Gold Aura</title>
  <style>
    html, body {
      width: 100%; height: 100%;
      margin: 0; padding: 0;
      background: transparent !important;
      overflow: hidden;
      box-shadow: none !important;
      user-select: none;
      -webkit-app-region: no-drag;
    }
    #aura {
      position: fixed;
      inset: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;               /* never block desktop input */
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="aura"></canvas>
  <script src="renderer.js"></script>
</body>
</html>
