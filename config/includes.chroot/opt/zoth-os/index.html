<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zoth OS</title>
  <link rel="stylesheet" href="desk.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="app">
    <nav class="rail" aria-label="Sections">
      <img class="seal" src="mark.svg" alt="" />
      <button type="button" data-view="desk" class="on">Desk</button>
      <button type="button" data-view="arms">Arms</button>
      <button type="button" data-view="mind">Mind</button>
      <button type="button" data-view="chip">Chip</button>
      <button type="button" data-view="hub">Hub</button>
      <button type="button" data-view="ops">Ops</button>
      <div class="rail-foot" id="rail-mode">—</div>
    </nav>
    <div class="main">
      <header class="top">
        <div class="mark">
          <img src="mark.svg" alt="" />
          <div>
            <p class="ascii">Z O T H O S</p>
            <h1>ZOTHOS</h1>
          </div>
        </div>
        <label class="find">
          <span>Find</span>
          <input id="q" type="search" placeholder="nmap, hermes, model" autocomplete="off" spellcheck="false" />
        </label>
        <div class="clocks">
          <time id="clock">--:--:--</time>
          <span id="host">—</span>
        </div>
      </header>
      <section class="meters" aria-label="Live machine">
        <article>
          <span>CPU</span>
          <strong id="m-cpu">—</strong>
          <i id="b-cpu"></i>
        </article>
        <article>
          <span>Memory</span>
          <strong id="m-ram">—</strong>
          <i id="b-ram"></i>
        </article>
        <article>
          <span>Disk</span>
          <strong id="m-disk">—</strong>
          <i id="b-disk"></i>
        </article>
        <article>
          <span>Net</span>
          <strong id="m-net">—</strong>
          <i id="b-net"></i>
        </article>
        <article>
          <span>Heat</span>
          <strong id="m-temp">—</strong>
          <small id="m-load">load —</small>
        </article>
      </section>
      <p class="lede" id="lede">Reading the machine.</p>
      <section class="stage" id="stage" aria-live="polite"></section>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="desk.js"></script>
</body>
</html>
