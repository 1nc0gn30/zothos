<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="smokeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0a14" stop-opacity="1" />
      <stop offset="40%" stop-color="#120e24" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#050508" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="50%" stop-color="#7c9cff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coreAura" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#050508" stop-opacity="0" />
    </radialGradient>
    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" fill="#030408" rx="32" />
  <circle cx="256" cy="256" r="220" fill="url(#smokeGlow)" />
  <circle cx="256" cy="256" r="180" fill="url(#coreAura)" />

  <!-- Shadow Vapor Tendrils -->
  <g filter="url(#shadowBlur)" opacity="0.85">
    <path d="M 256 100 C 180 120 120 180 140 260 C 160 340 100 400 160 440 C 220 480 320 460 360 400 C 400 340 360 260 380 200 C 400 140 320 80 256 100 Z" fill="#080b18" />
    <path d="M 220 140 C 160 170 140 240 180 300 C 220 360 180 410 240 430 C 300 450 340 380 330 310 C 320 240 350 180 290 150 C 260 135 240 130 220 140 Z" fill="#0e1326" />
    <path d="M 256 170 C 200 190 180 250 210 300 C 240 350 230 380 260 390 C 290 400 310 350 300 290 C 290 230 310 190 270 175 Z" fill="#151b34" />
  </g>

  <!-- Ethereal Smoke Whisp Overlay -->
  <path d="M 170 230 Q 200 160 256 190 T 340 240 Q 380 320 320 370 T 200 360 Q 140 300 170 230 Z" fill="none" stroke="#2a1f4d" stroke-width="6" opacity="0.6" />
  <path d="M 190 250 Q 220 200 256 215 T 320 260 Q 340 310 300 340 T 220 330 Z" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.35" />

  <!-- Entity Glowing Eyes (Cyber Cyan & Gold) -->
  <ellipse cx="215" cy="245" rx="18" ry="8" fill="url(#eyeGlow)" transform="rotate(-8 215 245)" />
  <circle cx="215" cy="245" r="4" fill="#ffffff" />
  <ellipse cx="297" cy="245" rx="18" ry="8" fill="url(#eyeGlow)" transform="rotate(8 297 245)" />
  <circle cx="297" cy="245" r="4" fill="#ffffff" />

  <!-- Shadow Crown / Void Horns -->
  <path d="M 210 170 L 190 120 L 230 155 Z" fill="#1b1236" />
  <path d="M 302 170 L 322 120 L 282 155 Z" fill="#1b1236" />
  <path d="M 256 150 L 256 110 L 266 148 Z" fill="#241a45" />

  <!-- Outer Neon Border Ring -->
  <rect x="12" y="12" width="488" height="488" rx="26" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="2" />
  <text x="256" y="475" text-anchor="middle" font-family="monospace" font-size="14" fill="#c084fc" letter-spacing="4">ZZOTH · SHADOW ENTITY</text>
</svg>