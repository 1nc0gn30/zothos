<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="glRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>
    <linearGradient id="glCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0088cc"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="#120406"/>
  <!-- 3D Isometric Prism / WebGL Glyph -->
  <polygon points="50,18 80,35 50,52 20,35" fill="url(#glRed)"/>
  <polygon points="20,35 50,52 50,82 20,65" fill="#660000"/>
  <polygon points="80,35 50,52 50,82 80,65" fill="#cc1111"/>
  <!-- GL Inner Wireframe -->
  <line x1="50" y1="18" x2="50" y2="52" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <circle cx="50" cy="52" r="5" fill="#00f0ff"/>
  <text x="50" y="93" text-anchor="middle" fill="#f7f4ee" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1">WebGL</text>
</svg>