<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="agyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="33%" stop-color="#34A853"/>
      <stop offset="66%" stop-color="#FBBC05"/>
      <stop offset="100%" stop-color="#EA4335"/>
    </linearGradient>
    <linearGradient id="agyCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <filter id="agyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#060913"/>
  <!-- Antigravity Inverted Dual Rings -->
  <ellipse cx="50" cy="50" rx="36" ry="14" stroke="url(#agyGrad)" stroke-width="2.5" transform="rotate(-30 50 50)" fill="none" filter="url(#agyGlow)"/>
  <ellipse cx="50" cy="50" rx="36" ry="14" stroke="url(#agyGrad)" stroke-width="2.5" transform="rotate(30 50 50)" fill="none" filter="url(#agyGlow)"/>
  <!-- Core Levitating Monolith -->
  <circle cx="50" cy="50" r="12" fill="url(#agyCore)" opacity="0.85"/>
  <polygon points="50,38 60,56 40,56" fill="#ffffff"/>
  <polygon points="50,62 60,44 40,44" fill="#00f0ff" opacity="0.8"/>
</svg>
