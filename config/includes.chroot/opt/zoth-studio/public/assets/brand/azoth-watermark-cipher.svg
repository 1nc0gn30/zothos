<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" fill="none" role="img" aria-label="Master Azoth Alchemical Circuit Watermark">
  <defs>
    <linearGradient id="cipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#00f0ff" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Horizontal Hexagonal Alchemical Circuit Bus -->
  <g stroke="url(#cipGrad)" stroke-linecap="round" stroke-linejoin="round" opacity="0.65">
    <!-- Main Centerline Bus -->
    <path d="M 40 200 H 260 L 290 170 H 510 L 540 200 H 760" stroke-width="2" />
    <path d="M 80 160 H 240 L 270 130 H 530 L 560 160 H 720" stroke-width="1.2" stroke-dasharray="4 8" opacity="0.5" />
    <path d="M 80 240 H 240 L 270 270 H 530 L 560 240 H 720" stroke-width="1.2" stroke-dasharray="4 8" opacity="0.5" />

    <!-- Branching AST Traces -->
    <path d="M 160 200 L 190 250 H 230" stroke-width="1.5" />
    <path d="M 190 250 L 210 290 H 280" stroke-width="1.2" stroke-dasharray="3 3" />
    <path d="M 640 200 L 610 150 H 570" stroke-width="1.5" />
    <path d="M 610 150 L 590 110 H 520" stroke-width="1.2" stroke-dasharray="3 3" />

    <!-- Circuit Nodes -->
    <circle cx="40" cy="200" r="4" fill="#00f0ff" />
    <circle cx="260" cy="200" r="3" fill="#00f0ff" />
    <circle cx="290" cy="170" r="3" fill="#fbbf24" />
    <circle cx="510" cy="170" r="3" fill="#fbbf24" />
    <circle cx="540" cy="200" r="3" fill="#a855f7" />
    <circle cx="760" cy="200" r="4" fill="#a855f7" />
    <circle cx="230" cy="250" r="3" fill="#34d399" />
    <circle cx="280" cy="290" r="2.5" fill="#34d399" />
    <circle cx="570" cy="150" r="3" fill="#fbbf24" />
    <circle cx="520" cy="110" r="2.5" fill="#fbbf24" />
  </g>

  <!-- Center Sovereign Alchemical Azoth Emblem -->
  <g stroke="#fbbf24" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <circle cx="400" cy="200" r="80" stroke-width="1.8" />
    <circle cx="400" cy="200" r="70" stroke-width="1.2" stroke-dasharray="3 6" />
    <polygon points="400,135 456,233 344,233" stroke="#00f0ff" stroke-width="1.6" />
    <polygon points="400,265 344,167 456,167" stroke="#fbbf24" stroke-width="1.6" />
    <!-- Center Eye / Mark -->
    <circle cx="400" cy="200" r="14" stroke="#fbbf24" stroke-width="1.4" fill="none" />
    <circle cx="400" cy="200" r="4" fill="#00f0ff" />
    <path d="M 382 190 H 404 L 392 204 H 418" stroke="#00f0ff" stroke-width="2" />
  </g>
</svg>