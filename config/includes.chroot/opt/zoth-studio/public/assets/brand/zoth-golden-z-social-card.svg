<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Deep Canvas Radial Gradient -->
    <radialGradient id="socialBg" cx="30%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#111625"/>
      <stop offset="50%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- Ambient Glow behind Logo -->
    <radialGradient id="goldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(253, 224, 71, 0.25)"/>
      <stop offset="50%" stop-color="rgba(0, 240, 255, 0.08)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="scGoldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7cc"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="scGoldSpine" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="scGoldBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <linearGradient id="scRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix type="matrix" values="1 0 0 0 0.9  0 1 0 0 0.7  0 0 1 0 0.2  0 0 0 0.45 0"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#socialBg)"/>

  <!-- Subtle Hermetic Grid Pattern -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Ambient Glowing Aura -->
  <circle cx="270" cy="315" r="260" fill="url(#goldAura)"/>

  <!-- Left: Golden Z Badge -->
  <g transform="translate(80, 125)">
    <!-- Outer Rounded Badge -->
    <rect x="0" y="0" width="380" height="380" rx="90" fill="#080c16" stroke="url(#scRing)" stroke-width="2"/>
    
    <!-- Subtle Hermetic Orbital Halo -->
    <circle cx="190" cy="190" r="140" fill="none" stroke="url(#scRing)" stroke-width="1.8" stroke-dasharray="10 6" opacity="0.6"/>
    
    <!-- Golden Z Mark inside Social Card -->
    <g transform="translate(190, 190) scale(0.68) translate(-256, -256)" filter="url(#cardGlow)">
      <!-- Bottom Bar -->
      <path d="M 144 344 L 356 344 C 368 344 376 352 376 364 C 376 376 368 384 356 384 L 144 384 C 132 384 124 376 124 364 C 124 352 132 344 144 344 Z" fill="url(#scGoldBottom)"/>

      <!-- Diagonal Spine -->
      <path d="M 368 136 C 378 136 384 146 378 156 L 158 376 C 148 386 132 380 136 366 L 348 146 C 354 139 360 136 368 136 Z" fill="url(#scGoldSpine)"/>

      <!-- Top Bar -->
      <path d="M 156 128 L 356 128 C 368 128 376 136 376 148 C 376 160 368 168 356 168 L 156 168 C 144 168 136 160 136 148 C 136 136 144 128 156 128 Z" fill="url(#scGoldTop)"/>

      <!-- Core Reflection -->
      <path d="M 172 136 L 348 136 L 360 148 L 194 344 L 148 344 Z" fill="#ffffff" opacity="0.22"/>

      <!-- Hermetic Spark ✦ -->
      <g transform="translate(256, 256)">
        <circle cx="0" cy="0" r="14" fill="rgba(0, 240, 255, 0.25)"/>
        <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="#ffffff"/>
        <circle cx="0" cy="0" r="3" fill="#00f0ff"/>
      </g>
    </g>
  </g>

  <!-- Right: Branding & Typography -->
  <g transform="translate(510, 175)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="280" height="36" rx="18" fill="rgba(253, 224, 71, 0.1)" stroke="rgba(253, 224, 71, 0.35)" stroke-width="1"/>
    <text x="16" y="23" font-family="'IBM Plex Mono', monospace, sans-serif" font-size="14" font-weight="700" fill="#fde047" letter-spacing="1.5">✦ SOVEREIGN AI FOUNDRY</text>

    <!-- Main Title -->
    <text x="0" y="110" font-family="'Syne', 'Figtree', sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">ZOTH <tspan fill="#fde047">STUDIO</tspan></text>

    <!-- Subtitle Description -->
    <text x="0" y="165" font-family="'Figtree', sans-serif" font-size="24" font-weight="600" fill="#cbd5e1">Autonomous Multi-Agent Web &amp; 3D Omniverse</text>
    <text x="0" y="205" font-family="'Figtree', sans-serif" font-size="18" font-weight="400" fill="#94a3b8">Generate, synthesize, and export production-grade repositories in seconds.</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 245)">
      <rect x="0" y="0" width="150" height="36" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="16" y="23" font-family="'Figtree', sans-serif" font-size="14" font-weight="700" fill="#38bdf8">⚡ 21 AI Agents</text>

      <rect x="165" y="0" width="180" height="36" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="181" y="23" font-family="'Figtree', sans-serif" font-size="14" font-weight="700" fill="#34d399">📚 306+ Blueprints</text>

      <rect x="360" y="0" width="160" height="36" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="376" y="23" font-family="'Figtree', sans-serif" font-size="14" font-weight="700" fill="#c084fc">📐 Nexus 3D CAD</text>
    </g>
  </g>
</svg>