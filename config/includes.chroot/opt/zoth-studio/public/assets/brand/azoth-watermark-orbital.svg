<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="100%" height="100%" fill="none" role="img" aria-label="Master Azoth Orbital Pantheon Astrolabe Watermark">
  <defs>
    <linearGradient id="orbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="orbCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Orbital Concentric Tracks -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <circle cx="350" cy="350" r="330" stroke="url(#orbGold)" stroke-width="1.4" stroke-dasharray="6 12" opacity="0.35" />
    <circle cx="350" cy="350" r="290" stroke="url(#orbCyan)" stroke-width="2" opacity="0.6" />
    <circle cx="350" cy="350" r="240" stroke="url(#orbGold)" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.5" />
    <circle cx="350" cy="350" r="180" stroke="url(#orbCyan)" stroke-width="1.6" opacity="0.55" />
    <circle cx="350" cy="350" r="120" stroke="url(#orbGold)" stroke-width="2.2" opacity="0.7" />
    <circle cx="350" cy="350" r="60" stroke="url(#orbCyan)" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6" />
  </g>

  <!-- 21 Agent Orbital Nodes & Coordinates -->
  <g fill="#fbbf24" opacity="0.7">
    <!-- Key Quadrants -->
    <circle cx="350" cy="60" r="4.5" />
    <circle cx="640" cy="350" r="4.5" />
    <circle cx="350" cy="640" r="4.5" />
    <circle cx="60" cy="350" r="4.5" />
    <!-- 21 Satellite Orbits -->
    <circle cx="495" cy="116" r="3.5" fill="#00f0ff" />
    <circle cx="595" cy="210" r="3" />
    <circle cx="625" cy="420" r="3.5" fill="#a855f7" />
    <circle cx="545" cy="520" r="3" />
    <circle cx="435" cy="615" r="3.5" fill="#00f0ff" />
    <circle cx="265" cy="615" r="3" />
    <circle cx="155" cy="520" r="3.5" fill="#34d399" />
    <circle cx="75" cy="420" r="3" />
    <circle cx="105" cy="210" r="3.5" fill="#00f0ff" />
    <circle cx="205" cy="116" r="3" />
  </g>

  <!-- Astrolabe Intersecting Radians -->
  <g stroke="url(#orbGold)" stroke-width="1" opacity="0.3" stroke-linecap="round">
    <line x1="350" y1="20" x2="350" y2="680" stroke-dasharray="8 8" />
    <line x1="20" y1="350" x2="680" y2="350" stroke-dasharray="8 8" />
    <line x1="116" y1="116" x2="584" y2="584" stroke-dasharray="4 8" />
    <line x1="116" y1="584" x2="584" y2="116" stroke-dasharray="4 8" />
  </g>

  <!-- Central Azoth Core Glyphs -->
  <g stroke="url(#orbGold)" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <!-- Inner Alchemical Hexagon -->
    <polygon points="350,230 454,290 454,410 350,470 246,410 246,290" stroke-width="1.8" />
    <!-- Hexagram Star Triangles -->
    <polygon points="350,245 440,400 260,400" stroke="url(#orbCyan)" stroke-width="1.6" />
    <polygon points="350,455 260,300 440,300" stroke="url(#orbGold)" stroke-width="1.6" />
    <!-- Azoth Core Z-Mark Glyph -->
    <path d="M 314 316 H 350 L 334 338 H 386" stroke="#00f0ff" stroke-width="2.4" />
    <circle cx="350" cy="350" r="12" stroke="#fbbf24" stroke-width="1.5" />
    <circle cx="350" cy="350" r="3" fill="#00f0ff" />
  </g>
</svg>