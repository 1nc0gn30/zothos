<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldTopT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7cc"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="goldSpineT" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="goldBottomT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <linearGradient id="goldRingT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.6"/>
    </linearGradient>

    <filter id="goldGlowT" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix type="matrix" values="1 0 0 0 0.9  0 1 0 0 0.7  0 0 1 0 0.2  0 0 0 0.45 0"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Subtle Hermetic Detail: Alchemical Orbital Halo -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#goldRingT)" stroke-width="3" stroke-dasharray="12 8" opacity="0.55"/>

  <!-- Main Golden 'Z' Letterform -->
  <g filter="url(#goldGlowT)">
    <!-- Bottom Horizontal Bar -->
    <path d="M 144 344 L 356 344 C 368 344 376 352 376 364 C 376 376 368 384 356 384 L 144 384 C 132 384 124 376 124 364 C 124 352 132 344 144 344 Z" 
          fill="url(#goldBottomT)"/>

    <!-- Dynamic Diagonal Spine -->
    <path d="M 368 136 
             C 378 136 384 146 378 156 
             L 158 376 
             C 148 386 132 380 136 366 
             L 348 146 
             C 354 139 360 136 368 136 Z" 
          fill="url(#goldSpineT)"/>

    <!-- Top Horizontal Bar -->
    <path d="M 156 128 L 356 128 C 368 128 376 136 376 148 C 376 160 368 168 356 168 L 156 168 C 144 168 136 160 136 148 C 136 136 144 128 156 128 Z" 
          fill="url(#goldTopT)"/>

    <!-- Core Facet Cut / Light Reflection Sheen -->
    <path d="M 172 136 L 348 136 L 360 148 L 194 344 L 148 344 Z" 
          fill="#ffffff" opacity="0.22"/>

    <!-- Subtle Hermetic Center Seal / Golden Alchemical Spark ✦ -->
    <g transform="translate(256, 256)">
      <circle cx="0" cy="0" r="12" fill="rgba(0, 240, 255, 0.2)"/>
      <path d="M 0 -16 Q 0 0 16 0 Q 0 0 0 16 Q 0 0 -16 0 Q 0 0 0 -16 Z" 
            fill="#ffffff" opacity="0.95"/>
      <circle cx="0" cy="0" r="2.5" fill="#00f0ff"/>
    </g>

    <!-- Top-Right Hermetic Spark Accent -->
    <g transform="translate(390, 118)">
      <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" 
            fill="#fef08a" opacity="0.9"/>
      <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
    </g>
  </g>
</svg>