<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0a1628" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="900" cy="200" r="350" fill="url(#glow)" />
  <circle cx="300" cy="500" r="300" fill="url(#glow)" />

  <!-- Grid overlay -->
  <path d="M0,100 H1200 M0,200 H1200 M0,300 H1200 M0,400 H1200 M0,500 H1200" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4" />
  <path d="M200,0 V630 M400,0 V630 M600,0 V630 M800,0 V630 M1000,0 V630" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4" />

  <!-- Glass container -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b" stroke-width="2" />
  <rect x="80" y="80" width="1040" height="6" fill="url(#accent)" rx="3" />

  <!-- Lock / Shield Graphic -->
  <g transform="translate(140, 180)">
    <circle cx="70" cy="70" r="65" fill="#030712" stroke="#00f2fe" stroke-width="4" />
    <path d="M70,30 L105,48 V82 C105,108 70,125 70,125 C70,125 35,108 35,82 V48 Z" fill="none" stroke="#00ff87" stroke-width="5" stroke-linejoin="round" />
    <circle cx="70" cy="72" r="8" fill="#00f2fe" />
    <path d="M70,80 V95" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="310" y="220" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="#ffffff" letter-spacing="-1">LibSignal Core Protocol</text>
  <text x="310" y="275" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="28" fill="#00f2fe">Interactive Cryptographic Suite &amp; Double Ratchet Inspector</text>
  <text x="310" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8" width="700">
    End-to-End Encryption • X3DH &amp; PQXDH Post-Quantum • Sealed Sender • ZKGroup Credentials
  </text>

  <!-- Badges -->
  <g transform="translate(310, 375)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="180" height="42" rx="8" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5" />
    <text x="90" y="26" font-family="monospace" font-size="15" fill="#00f2fe" text-anchor="middle" font-weight="700">AES-256-GCM</text>

    <!-- Badge 2 -->
    <rect x="200" y="0" width="180" height="42" rx="8" fill="#1e293b" stroke="#00ff87" stroke-width="1.5" />
    <text x="290" y="26" font-family="monospace" font-size="15" fill="#00ff87" text-anchor="middle" font-weight="700">HKDF-SHA256</text>

    <!-- Badge 3 -->
    <rect x="400" y="0" width="180" height="42" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <text x="490" y="26" font-family="monospace" font-size="15" fill="#a855f7" text-anchor="middle" font-weight="700">Curve25519</text>

    <!-- Badge 4 -->
    <rect x="600" y="0" width="160" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="680" y="26" font-family="monospace" font-size="15" fill="#38bdf8" text-anchor="middle" font-weight="700">Kyber-768</text>
  </g>

  <!-- Footer showcase link -->
  <text x="310" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748b">Portfolio Showcase: <tspan fill="#ffffff" font-weight="700">nealfrazier.tech/libsignal</tspan></text>
</svg>
