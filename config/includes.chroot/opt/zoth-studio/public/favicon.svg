<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#161c2e"/>
      <stop offset="60%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#030509"/>
    </radialGradient>

    <!-- Rich Metallic Gold Gradients -->
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7cc"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="goldSpine" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="goldBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Ambient Shadow & Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix type="matrix" values="1 0 0 0 0.9  0 1 0 0 0.7  0 0 1 0 0.2  0 0 0 0.5 0"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Shield / Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGlow)" stroke="url(#borderGrad)" stroke-width="2.5" filter="url(#dropShadow)"/>

  <!-- Subtle Hermetic Detail: Alchemical Orbital Halo -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#goldRing)" stroke-width="2" stroke-dasharray="12 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="144" fill="none" stroke="rgba(234, 179, 8, 0.15)" stroke-width="1"/>

  <!-- Subtle Hermetic Cardinal Nodes -->
  <circle cx="256" cy="80" r="3.5" fill="#fde047" opacity="0.8"/>
  <circle cx="256" cy="432" r="3.5" fill="#fde047" opacity="0.8"/>
  <circle cx="80" cy="256" r="3.5" fill="#00f0ff" opacity="0.8"/>
  <circle cx="432" cy="256" r="3.5" fill="#00f0ff" opacity="0.8"/>

  <!-- Main Golden 'Z' Letterform with Soft Friendly Bevels & Kinetic Flow -->
  <g filter="url(#goldGlow)">
    <!-- Drop Ambient Silhouette for 3D depth -->
    <path d="M 148 140 
             L 364 140 
             A 16 16 0 0 1 378 162 
             L 204 360 
             L 364 360 
             A 16 16 0 0 1 364 392 
             L 148 392 
             A 16 16 0 0 1 134 370 
             L 308 172 
             L 148 172 
             A 16 16 0 0 1 148 140 Z" 
          fill="#000000" opacity="0.4" transform="translate(0, 8)"/>

    <!-- Bottom Horizontal Bar -->
    <path d="M 144 344 L 356 344 C 368 344 376 352 376 364 C 376 376 368 384 356 384 L 144 384 C 132 384 124 376 124 364 C 124 352 132 344 144 344 Z" 
          fill="url(#goldBottom)"/>

    <!-- Dynamic Diagonal Spine -->
    <path d="M 368 136 
             C 378 136 384 146 378 156 
             L 158 376 
             C 148 386 132 380 136 366 
             L 348 146 
             C 354 139 360 136 368 136 Z" 
          fill="url(#goldSpine)"/>

    <!-- Top Horizontal Bar -->
    <path d="M 156 128 L 356 128 C 368 128 376 136 376 148 C 376 160 368 168 356 168 L 156 168 C 144 168 136 160 136 148 C 136 136 144 128 156 128 Z" 
          fill="url(#goldTop)"/>

    <!-- Core Facet Cut / Light Reflection Sheen -->
    <path d="M 172 136 L 348 136 L 360 148 L 194 344 L 148 344 Z" 
          fill="#ffffff" opacity="0.22"/>

    <!-- Subtle Hermetic Center Seal / Golden Alchemical Spark ✦ -->
    <g transform="translate(256, 256)">
      <circle cx="0" cy="0" r="14" fill="rgba(0, 240, 255, 0.2)" filter="url(#goldGlow)"/>
      <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" 
            fill="#ffffff" opacity="0.95"/>
      <circle cx="0" cy="0" r="3" fill="#00f0ff"/>
    </g>

    <!-- Top-Right Hermetic Spark Accent -->
    <g transform="translate(390, 118)">
      <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" 
            fill="#fef08a" opacity="0.9"/>
      <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
    </g>
  </g>
</svg>