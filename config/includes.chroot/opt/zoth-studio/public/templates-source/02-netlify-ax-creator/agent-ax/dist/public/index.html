<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent AX — Hermes Agent Access Layer</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Agent AX</h1>
      <p class="tagline">A Hermes-powered access layer for any AI agent.</p>
      <nav>
        <a href="#docs">Docs</a>
        <a href="https://github.com/you/agent-ax" target="_blank">GitHub</a>
      </nav>
    </header>

    <section id="playground">
      <h2>Live Playground</h2>
      <div class="card">
        <label for="endpoint-select">Endpoint</label>
        <select id="endpoint-select">
          <option value="/api/ping">/api/ping</option>
          <option value="/api/hermes-proxy">/api/hermes-proxy</option>
        </select>

        <label for="method-select">Method</label>
        <select id="method-select">
          <option>GET</option>
          <option>POST</option>
        </select>

        <label for="payload-input">Request Body</label>
        <textarea id="payload-input" rows="6">{}</textarea>

        <button id="send-btn">Send Request</button>
        <button id="clear-btn" type="button">Clear</button>

        <label for="response-output">Response</label>
        <pre id="response-output" class="mono">Ready.</pre>
      </div>
    </section>

    <section id="status">
      <h2>Environment Status</h2>
      <div class="grid">
        <div class="status-card">
          <h3>Netlify Functions</h3>
          <p id="functions-status">Unknown</p>
        </div>
        <div class="status-card">
          <h3>Hermes Backend</h3>
          <p id="hermes-status">Unknown</p>
        </div>
      </div>
    </section>
  </main>

  <script src="/main.js"></script>
</body>
</html>
