    <radialGradient id="og-glow" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0%" stopColor="#00f0ff" stopOpacity="0.22" />
      <stop offset="100%" stopColor="#08090d" stopOpacity="0" />
