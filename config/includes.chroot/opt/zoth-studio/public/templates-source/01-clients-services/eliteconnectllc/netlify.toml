[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/about/"
  to = "/about-us/"
  status = 301

[[redirects]]
  from = "/work/"
  to = "/gallery/"
  status = 301

[[redirects]]
  from = "/clients-2/"
  to = "/client-portal/"
  status = 301

[[redirects]]
  from = "/elite-connect-llc-2/"
  to = "/"
  status = 301

[[redirects]]
  from = "/Home"
  to = "/"
  status = 301
