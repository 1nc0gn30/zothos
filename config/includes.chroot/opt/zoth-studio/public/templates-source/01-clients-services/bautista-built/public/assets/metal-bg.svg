<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Define a dark metal gradient -->
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#444444; stop-opacity:1" />
      <stop offset="50%" style="stop-color:#222222; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#444444; stop-opacity:1" />
    </linearGradient>
    <!-- Geometric cross-hatch pattern -->
    <pattern id="geomPattern" patternUnits="userSpaceOnUse" width="40" height="40">
      <rect width="40" height="40" fill="none" />
      <path d="M0 0 L40 40 M40 0 L0 40" stroke="#666666" stroke-width="1" />
    </pattern>
    <!-- Noise filter for texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="noise"/>
      <feColorMatrix type="saturate" values="0" result="mono"/>
    </filter>
  </defs>
  <!-- Base gradient background -->
  <rect width="800" height="600" fill="url(#metalGradient)" />
  <!-- Geometric overlay -->
  <rect width="800" height="600" fill="url(#geomPattern)" opacity="0.3" />
  <!-- Subtle noise overlay -->
  <rect width="800" height="600" filter="url(#noise)" opacity="0.1" />
</svg>
