<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="Nature Harmony Landscaping logo">
  <rect width="40" height="40" fill="#fafaf9" />
  <defs>
    <pattern id="logo-speckle" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#d6d3d1" />
      <circle cx="4" cy="4" r="0.4" fill="#d6d3d1" />
    </pattern>
  </defs>
  <rect width="40" height="40" fill="url(#logo-speckle)" />
  <text x="20" y="15.5" text-anchor="middle" font-size="15" font-family="Georgia, 'Times New Roman', serif" font-weight="300" fill="#bfa06f" letter-spacing="-1">N</text>
  <line x1="12" y1="19" x2="28" y2="19" stroke="#bfa06f" stroke-width="0.8" />
  <text x="20" y="32.5" text-anchor="middle" font-size="15" font-family="Georgia, 'Times New Roman', serif" font-weight="300" fill="#bfa06f" letter-spacing="-1">H</text>
</svg>
