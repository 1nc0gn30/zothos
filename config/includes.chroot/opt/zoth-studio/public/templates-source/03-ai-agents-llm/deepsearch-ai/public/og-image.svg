<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="DeepSearch AI Open Graph banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="33%" stop-color="#8b5cf6"/>
      <stop offset="66%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" />
    <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" />
  </g>

  <!-- Glowing Accent Orbs -->
  <circle cx="200" cy="150" r="180" fill="#3b82f6" fill-opacity="0.15" filter="url(#glow)"/>
  <circle cx="1000" cy="480" r="220" fill="#8b5cf6" fill-opacity="0.15" filter="url(#glow)"/>

  <!-- Logo & Title -->
  <g transform="translate(100, 180)">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="76" letter-spacing="-0.03em">
      <tspan fill="#4285F4">D</tspan>
      <tspan fill="#EA4335">e</tspan>
      <tspan fill="#FBBC05">e</tspan>
      <tspan fill="#4285F4">p</tspan>
      <tspan fill="#34A853">S</tspan>
      <tspan fill="#EA4335">e</tspan>
      <tspan fill="#FBBC05">a</tspan>
      <tspan fill="#4285F4">r</tspan>
      <tspan fill="#34A853">c</tspan>
      <tspan fill="#EA4335">h</tspan>
      <tspan fill="#ffffff" font-weight="300"> AI</tspan>
    </text>
    <text y="70" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400">
      Autonomous Grounded Research Synthesis &amp; Visual Analytics Agent
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(100, 340)" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">
    <!-- Pill 1 -->
    <rect width="210" height="44" rx="22" fill="#1e293b" stroke="#334155"/>
    <text x="105" y="28" fill="#60a5fa" text-anchor="middle">⚡ Gemini Grounded</text>

    <!-- Pill 2 -->
    <rect x="230" width="220" height="44" rx="22" fill="#1e293b" stroke="#334155"/>
    <text x="340" y="28" fill="#c084fc" text-anchor="middle">📊 Visual Data Charts</text>

    <!-- Pill 3 -->
    <rect x="470" width="210" height="44" rx="22" fill="#1e293b" stroke="#334155"/>
    <text x="575" y="28" fill="#4ade80" text-anchor="middle">🔍 Real Citation Links</text>
  </g>

  <!-- Footer Link -->
  <g transform="translate(100, 520)" font-family="system-ui, -apple-system, sans-serif">
    <text font-size="22" font-weight="600" fill="#f8fafc">nealfrazier.tech showcase</text>
    <text y="30" font-size="18" fill="#64748b">https://deepsearch-ai.nealfrazier.tech</text>
  </g>
</svg>
