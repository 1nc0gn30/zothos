<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AI Talk AI Go Open Graph banner">
  <defs>
    <!-- Dark Primitive Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>

    <!-- Amber Glow Gradient -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Stone Slab Fill -->
    <linearGradient id="slabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>

    <!-- Drop Shadows and Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Background Glowing Orbs -->
  <circle cx="200" cy="150" r="280" fill="#f59e0b" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1000" cy="500" r="320" fill="#d97706" opacity="0.06" filter="url(#glow)"/>

  <!-- Decorative Grid / Stone Lines -->
  <path d="M 0 100 Q 600 120 1200 100 M 0 300 Q 600 280 1200 300 M 0 500 Q 600 520 1200 500" stroke="#44403c" stroke-width="1" opacity="0.2" fill="none"/>

  <!-- Central Stone Slab Container -->
  <rect x="80" y="70" width="1040" height="490" rx="32" fill="url(#slabGrad)" stroke="#78350f" stroke-width="4" filter="url(#shadow)"/>

  <!-- Header Badge -->
  <rect x="130" y="115" width="340" height="42" rx="21" fill="#78350f" opacity="0.4" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="300" y="142" fill="#f59e0b" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="3" text-anchor="middle">LARGE LITHIC MODEL • V7.0</text>

  <!-- Title: AI TALK AI GO -->
  <text x="130" y="240" fill="#f5f5f4" font-size="80" font-family="system-ui, -apple-system, sans-serif" font-weight="900" letter-spacing="-2" font-style="italic">
    AI TALK <tspan fill="url(#amberGlow)">AI GO</tspan>
  </text>

  <!-- Subtitle -->
  <text x="130" y="305" fill="#d6d3d1" font-size="28" font-family="system-ui, -apple-system, sans-serif" font-weight="600">
    Primitive AI Voice Assistant &amp; Lithic Prompt Engineering Playground
  </text>

  <!-- Features Pills -->
  <g transform="translate(130, 350)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="260" height="50" rx="14" fill="#292524" stroke="#57534e" stroke-width="2"/>
    <text x="130" y="32" fill="#f59e0b" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle">🎙️ Voice AI Agent (Oog)</text>

    <!-- Pill 2 -->
    <rect x="280" y="0" width="270" height="50" rx="14" fill="#292524" stroke="#57534e" stroke-width="2"/>
    <text x="415" y="32" fill="#f59e0b" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle">📜 60+ Cave Wall Prompts</text>

    <!-- Pill 3 -->
    <rect x="570" y="0" width="270" height="50" rx="14" fill="#292524" stroke="#57534e" stroke-width="2"/>
    <text x="705" y="32" fill="#f59e0b" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle">📊 High-DPI Spectrum Canvas</text>
  </g>

  <!-- Footer Link & Author Info -->
  <line x1="130" y1="465" x2="1010" y2="465" stroke="#44403c" stroke-width="2" opacity="0.6"/>
  <text x="130" y="510" fill="#a8a29e" font-size="20" font-family="monospace" font-weight="700">
    https://ai-talk-ai-go.nealfrazier.tech
  </text>
  <text x="1010" y="510" fill="#f59e0b" font-size="20" font-family="system-ui, -apple-system, sans-serif" font-weight="800" text-anchor="end">
    NEAL FRAZIER SHOWCASE
  </text>
</svg>
