[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "http://auraai.757tech.pro/*"
  to = "https://auraai.757tech.pro/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.auraai.757tech.pro/*"
  to = "https://auraai.757tech.pro/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
