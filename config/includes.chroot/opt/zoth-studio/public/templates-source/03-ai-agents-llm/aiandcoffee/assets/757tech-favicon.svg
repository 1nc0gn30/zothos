<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <title>Robot Data</title>
  <desc>A friendly AI robot surrounded by connected data nodes.</desc>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf5e6"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="80" fill="#00d4ff" fill-opacity="0.05" stroke="#00d4ff" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="100" cy="100" r="60" fill="#00d4ff" fill-opacity="0.1"/>
  <rect x="64" y="74" width="80" height="60" rx="20" fill="#000000" opacity="0.1"/>
  <rect x="60" y="70" width="80" height="60" rx="20" fill="url(#body-grad)" stroke="#1a202c" stroke-width="4"/>
  <rect x="70" y="80" width="60" height="40" rx="10" fill="#1a202c" opacity="0.05"/>
  <circle cx="85" cy="95" r="7" fill="#1a202c"/>
  <circle cx="115" cy="95" r="7" fill="#1a202c"/>
  <path d="M85 110 Q100 120 115 110" fill="none" stroke="#1a202c" stroke-width="3" stroke-linecap="round"/>
  <path d="M95 70 L105 70 L102 60 L98 60 Z" fill="#1a202c"/>
  <path d="M100 40 L100 60" stroke="#1a202c" stroke-width="4"/>
  <circle cx="100" cy="35" r="8" fill="#ff6b6b" filter="url(#glow)"/>
  <circle cx="160" cy="80" r="4" fill="#00d4ff" filter="url(#glow)"/>
  <circle cx="170" cy="110" r="6" fill="#ff6b6b" filter="url(#glow)"/>
  <circle cx="30" cy="90" r="5" fill="#00d4ff" filter="url(#glow)"/>
  <path d="M140 100 L160 80" stroke="#00d4ff" stroke-width="2" stroke-dasharray="2 2"/>
  <path d="M140 100 L170 110" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="2 2"/>
  <path d="M60 100 L30 90" stroke="#00d4ff" stroke-width="2" stroke-dasharray="2 2"/>
</svg>
