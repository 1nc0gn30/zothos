<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoth AI Desktop Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: 'JetBrains Mono', 'Segoe UI', monospace;
      border: none !important;
      box-shadow: none !important;
    }
    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 25px;
      position: relative;
      background: transparent !important;
    }

    /* Speech Bubble Overlay - Ultra-Clean Floating Glass */
    .speech-bubble {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      background: rgba(6, 10, 18, 0.92);
      border: 1.5px solid #00ff9d;
      border-radius: 12px;
      padding: 12px 14px;
      color: #f1f5f9;
      font-size: 10.5px;
      line-height: 1.45;
      box-shadow: 0 0 25px rgba(0, 255, 157, 0.3);
      backdrop-filter: blur(16px);
      opacity: 0;
      transform: translateY(-10px) scale(0.95);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: auto;
    }
    .speech-bubble.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -9px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 9px 9px 0;
      border-style: solid;
      border-color: rgba(6, 10, 18, 0.92) transparent;
    }
    .bubble-agent {
      font-size: 9.5px;
      font-weight: 800;
      color: #00ff9d;
      margin-bottom: 4px;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .bubble-agent::before {
      content: '●';
      color: #00ff9d;
      font-size: 8px;
      animation: pulse-dot 1.5s infinite;
    }
    @keyframes pulse-dot { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    /* Mascot Floating Wrapper */
    .mascot-wrapper {
      width: 170px;
      height: 170px;
      position: relative;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: bobbing 4s ease-in-out infinite;
      -webkit-app-region: drag;
    }
    .mascot-wrapper:active {
      cursor: grabbing;
    }
    @keyframes bobbing {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-14px) rotate(2deg); }
    }

    /* Outer Holographic & Planetary Glyphs Ring */
    .holo-ring {
      position: absolute;
      inset: 0;
      border: 2px dashed rgba(0, 255, 157, 0.5);
      border-radius: 50%;
      animation: spin 14s linear infinite;
      box-shadow: 0 0 20px rgba(0, 255, 157, 0.25);
    }
    .holo-ring-inner {
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(0, 229, 255, 0.4);
      border-radius: 50%;
      animation: spin-reverse 9s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }

    /* Core AI Orb Engine */
    .orb-core {
      width: 114px;
      height: 114px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #00ff9d 0%, #00e5ff 40%, #070d18 90%);
      box-shadow: 0 0 30px rgba(0, 255, 157, 0.65), inset 0 0 20px rgba(255, 255, 255, 0.6);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }
    .orb-core:hover {
      box-shadow: 0 0 45px rgba(0, 255, 157, 0.9), inset 0 0 25px rgba(255, 255, 255, 0.85);
      transform: scale(1.04);
    }

    /* Laser Eye Socket & Iris */
    .eye-socket {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #030509;
      border: 2px solid #00ff9d;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0, 255, 157, 0.8);
    }
    .eye-pupil {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #00ff9d 60%, #00e5ff 100%);
      box-shadow: 0 0 14px #00ff9d, 0 0 25px #00e5ff;
      position: absolute;
      transition: transform 0.04s ease-out, scale 0.2s;
    }
    .eye-pupil.reading {
      transform: scale(1.35) !important;
      box-shadow: 0 0 20px #00e5ff, 0 0 30px #00ff9d;
    }
    .scan-beam {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 255, 157, 0.8), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .scan-beam.active {
      opacity: 1;
      animation: scan 1.2s ease-in-out infinite;
    }
    @keyframes scan {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    /* Right Click Launcher Menu */
    .pet-menu {
      position: absolute;
      bottom: 25px;
      background: rgba(6, 10, 18, 0.95);
      border: 1.5px solid #00e5ff;
      border-radius: 10px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 15px rgba(0, 229, 255, 0.3);
      opacity: 0;
      pointer-events: none;
      transform: scale(0.9);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .pet-menu.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }
    .menu-item {
      padding: 7px 14px;
      font-size: 10.5px;
      font-weight: 700;
      color: #f1f5f9;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }
    .menu-item:hover {
      background: rgba(0, 229, 255, 0.2);
      color: #00e5ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Speech Bubble Overlay -->
    <div id="speech-bubble" class="speech-bubble">
      <div id="bubble-agent" class="bubble-agent">GHOSTBYTE NULLAI</div>
      <div id="bubble-text">ZothOS Companion active. Reading cursor vector and system telemetry.</div>
    </div>

    <!-- Interactive Holographic Mascot -->
    <div class="mascot-wrapper" id="mascot-wrapper">
      <div class="holo-ring"></div>
      <div class="holo-ring-inner"></div>
      <div class="orb-core" id="orb-core" onclick="triggerPoke()">
        <div class="eye-socket">
          <div class="scan-beam" id="scan-beam"></div>
          <div class="eye-pupil" id="eye-pupil"></div>
        </div>
      </div>
    </div>

    <!-- Quick Launcher Context Menu -->
    <div id="pet-menu" class="pet-menu">
      <div class="menu-item" onclick="launch('studio')">🎨 Zoth Studio Pro</div>
      <div class="menu-item" onclick="launch('agent')">🤖 Zoth Agent OS</div>
      <div class="menu-item" onclick="launch('hexstrike')">⚡ HexStrike AI</div>
      <div class="menu-item" onclick="launch('reality')">🌿 Reality Switcher</div>
      <div class="menu-item" onclick="launch('ghost')">👻 NullAI Ghostmode</div>
      <div class="menu-item" onclick="launch('nexus')">📦 Zoth Tool Nexus</div>
      <div class="menu-item" onclick="toggleMenu()" style="color:#ff4757;">❌ Close Menu</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
