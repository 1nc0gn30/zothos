<!DOCTYPE html>
<html lang="en" data-theme="emerald">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZOTHOS // SOVEREIGN 3D SPATIAL OS</title>
  <script src="./vendor/three.min.js"></script>
  <script src="./vendor/OrbitControls.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    :root {
      --bg: #02040a;
      --accent: #00ff88;
      --accent-rgb: 0, 255, 136;
      --accent2: #00f3ff;
      --accent2-rgb: 0, 243, 255;
      --gold: #fbbf24;
      --purple: #a855f7;
      --fg: #ecfdf5;
      --card-bg: rgba(2, 8, 18, 0.90);
      --border: rgba(0, 255, 136, 0.4);
      --glow: 0 0 25px rgba(0, 255, 136, 0.5);
      --font-mono: 'JetBrains Mono', 'Share Tech Mono', 'DejaVu Sans Mono', monospace;
    }

    [data-theme="ghost"] {
      --accent: #c084fc;
      --accent-rgb: 192, 132, 252;
      --accent2: #a855f7;
      --fg: #faf5ff;
      --card-bg: rgba(12, 4, 24, 0.92);
      --border: rgba(168, 85, 247, 0.45);
      --glow: 0 0 25px rgba(168, 85, 247, 0.55);
    }

    [data-theme="gold"] {
      --accent: #fbbf24;
      --accent-rgb: 251, 191, 36;
      --accent2: #f59e0b;
      --fg: #fefce8;
      --card-bg: rgba(20, 14, 2, 0.92);
      --border: rgba(251, 191, 36, 0.45);
      --glow: 0 0 25px rgba(251, 191, 36, 0.55);
    }

    [data-theme="cyan"] {
      --accent: #00f3ff;
      --accent-rgb: 0, 243, 255;
      --accent2: #38bdf8;
      --fg: #f0fdfa;
      --card-bg: rgba(2, 14, 28, 0.92);
      --border: rgba(0, 243, 255, 0.45);
      --glow: 0 0 25px rgba(0, 243, 255, 0.55);
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font-mono);
      color: var(--fg);
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
      background-size: 100% 3px, 4px 100%;
    }

    /* Top HUD Action Bar */
    .top-action-bar {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      pointer-events: auto;
    }

    .brand-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 999px;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6), var(--glow);
    }

    .brand-pill .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(0.85); opacity: 0.7; }
      100% { transform: scale(1.25); opacity: 1; }
    }

    .brand-pill span {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--accent);
    }

    /* Zone Navigation Pills */
    .zone-nav {
      display: flex;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 999px;
      backdrop-filter: blur(16px);
      box-shadow: var(--glow);
    }

    .zone-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .zone-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .zone-btn.active {
      background: var(--accent);
      color: #02040a;
      box-shadow: 0 0 10px var(--accent);
    }

    .exit-controls {
      display: flex;
      gap: 10px;
    }

    .btn-exit {
      background: rgba(239, 68, 68, 0.25);
      border: 1px solid rgba(239, 68, 68, 0.7);
      color: #fca5a5;
      padding: 8px 18px;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(16px);
      transition: all 0.2s ease;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
    }

    .btn-exit:hover {
      background: rgba(239, 68, 68, 0.9);
      color: #ffffff;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
      transform: translateY(-1px);
    }

    /* 3D Spatial Prompt Bar & AI Entity Link */
    .spatial-ai-dock {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 720px;
      max-width: 90vw;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), var(--glow);
      z-index: 50;
    }

    .ai-orb-mini {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #02040a;
      font-size: 14px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .spatial-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-mono);
      font-size: 13px;
      color: #ffffff;
    }

    .spatial-input::placeholder {
      color: #64748b;
    }

    .layer-badge {
      background: rgba(0, 255, 136, 0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .layer-badge:hover {
      background: var(--accent);
      color: #02040a;
    }

    /* Target Hover Tooltip in 3D Space */
    .target-tooltip {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), var(--glow);
      z-index: 50;
      text-align: center;
      transition: all 0.2s ease;
      pointer-events: none;
      opacity: 0;
    }

    .target-tooltip.active {
      opacity: 1;
      transform: translateX(-50%) translateY(10px);
    }

    .target-title {
      font-size: 13px;
      font-weight: bold;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .target-desc {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 2px;
    }

    /* Bottom Status & Theme Bar */
    .bottom-bar {
      position: absolute;
      bottom: 24px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 40;
      pointer-events: none;
    }

    .telemetry-pill {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11px;
      color: var(--accent);
      backdrop-filter: blur(12px);
      box-shadow: var(--glow);
      pointer-events: auto;
    }

    .theme-picker {
      display: flex;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      pointer-events: auto;
    }

    .theme-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: transform 0.2s ease;
    }

    .theme-dot:hover {
      transform: scale(1.25);
    }

    .dot-emerald { background: #00ff88; }
    .dot-ghost { background: #c084fc; }
    .dot-gold { background: #fbbf24; }
    .dot-cyan { background: #00f3ff; }
  </style>
</head>
<body>

  <div id="webgl-canvas"></div>
  <div class="crt-overlay"></div>

  <!-- Top Action Bar -->
  <div class="top-action-bar">
    <div class="brand-pill">
      <div class="pulse-dot"></div>
      <span>ZOTHOS // 3D SPATIAL OS SHELL</span>
    </div>

    <!-- 3D Spatial Zone Jump Navigation -->
    <div class="zone-nav">
      <button class="zone-btn active" onclick="focusZone('agents', 0)">[1] AI AGENT NEXUS</button>
      <button class="zone-btn" onclick="focusZone('security', 1)">[2] SECURITY ARSENAL</button>
      <button class="zone-btn" onclick="focusZone('terminal', 2)">[3] 3D CODE TERMINAL</button>
      <button class="zone-btn" onclick="focusZone('studio', 3)">[4] ZOTH STUDIO SANCTUM</button>
    </div>

    <div class="exit-controls">
      <button class="btn-exit" onclick="exitSpatialOS()">✕ 2D DESKTOP [ESC]</button>
    </div>
  </div>

  <!-- 3D Target Tooltip -->
  <div class="target-tooltip" id="targetTooltip">
    <div class="target-title" id="ttTitle">ZOTH STUDIO</div>
    <div class="target-desc" id="ttDesc">Alchemical Neural Hub & Tooling Suite</div>
  </div>

  <!-- Bottom Floating 3D AI Command Dock -->
  <div class="spatial-ai-dock">
    <div class="ai-orb-mini">Ψ</div>
    <input type="text" class="spatial-input" id="aiInput" placeholder="Command AI Agent Overlord across 3D OS (e.g. 'run pentest scan', 'open studio', 'status')..." onkeydown="handleAiInput(event)">
    <div class="layer-badge" id="layerBadge" onclick="cycleLayer()">L4: SOVEREIGN</div>
  </div>

  <!-- Bottom Status Telemetry -->
  <div class="bottom-bar">
    <div class="telemetry-pill" id="telemetryPill">
      ● 3D SPATIAL ENGINE ACTIVE &nbsp;|&nbsp; 60 FPS &nbsp;|&nbsp; 1-4 JUMP ZONES &nbsp;|&nbsp; DRAG TO ORBIT
    </div>
    <div class="theme-picker">
      <div class="theme-dot dot-emerald" onclick="changeTheme('emerald')" title="Emerald Matrix"></div>
      <div class="theme-dot dot-ghost" onclick="changeTheme('ghost')" title="Ghost Amethyst"></div>
      <div class="theme-dot dot-gold" onclick="changeTheme('gold')" title="Celestial Gold"></div>
      <div class="theme-dot dot-cyan" onclick="changeTheme('cyan')" title="Electric Cyan"></div>
    </div>
  </div>

  <script>
    // ── 3D SPATIAL ZONES & WORKSTATION APPS ──────────────────────────────────
    const ZONES = {
      agents: {
        cameraPos: new THREE.Vector3(0, 10, 52),
        lookAt: new THREE.Vector3(0, 0, 0),
        items: [
          { id: 'zoth-agent-hud', name: 'Zoth Agent HUD', desc: 'Autonomous OS Controller & Layer Rings', exec: '/usr/local/bin/zoth-agent-hud', icon: '🜂', pos: [-20, 2, 0] },
          { id: 'hermes-agent', name: 'Hermes Agent', desc: 'Autonomous Gateway & Skill Bus', exec: 'xfce4-terminal -e hermes', icon: '☤', pos: [-10, 2, 0] },
          { id: 'aider-ai', name: 'Aider AI Pair', desc: '2026 Terminal AI Coding Agent', exec: 'xfce4-terminal -e aider', icon: '✦', pos: [0, 2, 0] },
          { id: 'claude-code', name: 'Claude Code', desc: 'Anthropic Coding Agent', exec: 'xfce4-terminal -e claude', icon: '✴', pos: [10, 2, 0] },
          { id: 'openai-codex', name: 'OpenAI Codex', desc: 'Codex AI CLI Toolchain', exec: 'xfce4-terminal -e codex', icon: '◎', pos: [20, 2, 0] }
        ]
      },
      security: {
        cameraPos: new THREE.Vector3(-60, 12, 12),
        lookAt: new THREE.Vector3(-60, 0, -20),
        items: [
          { id: 'hexstrike-ai', name: 'HexStrike AI', desc: 'Autonomous Pentesting Platform', exec: 'xfce4-terminal -e hexstrike', icon: '⚔', pos: [-76, 2, -20] },
          { id: 'caido-proxy', name: 'Caido Proxy', desc: '2026 Rust Web App Security Proxy', exec: 'caido', icon: '🛡', pos: [-68, 2, -20] },
          { id: 'nuclei-scanner', name: 'Nuclei v3', desc: 'Automated Vuln Scanner Engine', exec: 'xfce4-terminal -e nuclei -version', icon: '⚡', pos: [-60, 2, -20] },
          { id: 'garak-scanner', name: 'Garak Scanner', desc: 'LLM Vulnerability Scanner', exec: 'xfce4-terminal -e garak', icon: '☣', pos: [-52, 2, -20] },
          { id: 'zoth-sec', name: 'Security Arsenal', desc: 'Kali & Parrot Tooling Stack', exec: 'xfce4-terminal -e zoth-sec', icon: 'Ψ', pos: [-44, 2, -20] }
        ]
      },
      terminal: {
        cameraPos: new THREE.Vector3(60, 12, 12),
        lookAt: new THREE.Vector3(60, 0, -20),
        items: [
          { id: 'zoth-cockpit', name: 'Cockpit TUI', desc: 'Full-Screen Operations Dashboard', exec: 'xfce4-terminal -e zoth-cockpit', icon: '⛶', pos: [48, 2, -20] },
          { id: 'terminal-bash', name: 'ZOTH Terminal', desc: 'Obsidian Emerald Terminal', exec: 'xfce4-terminal', icon: '>', pos: [60, 2, -20] },
          { id: 'zellij-mux', name: 'Zellij Workspace', desc: 'Modern Rust Terminal Multiplexer', exec: 'xfce4-terminal -e zellij', icon: '⊞', pos: [72, 2, -20] }
        ]
      },
      studio: {
        cameraPos: new THREE.Vector3(0, 18, -60),
        lookAt: new THREE.Vector3(0, 0, -90),
        items: [
          { id: 'zoth-studio', name: 'Zoth Studio Hub', desc: 'Alchemical Neural Hub & App Suite', exec: '/opt/zoth-studio/launch.sh', icon: '⚡', pos: [-10, 2, -90] },
          { id: 'live-fx', name: 'Visual FX Engine', desc: 'Interactive 3D Matrix Visualizer', exec: '/usr/local/bin/zoth-live-wallpaper', icon: '〰', pos: [10, 2, -90] }
        ]
      }
    };

    let activeLayer = 4;
    const LAYER_NAMES = ["L0: SPECTRE", "L1: RUNECRAFTER", "L2: CYBERPUPPET", "L3: WARLOCK", "L4: SOVEREIGN"];
    function cycleLayer() {
      activeLayer = (activeLayer + 1) % 5;
      document.getElementById('layerBadge').innerText = LAYER_NAMES[activeLayer];
      fetch('http://127.0.0.1:8199/api/layer?val=' + activeLayer).catch(() => {});
    }

    function handleAiInput(e) {
      if (e.key === 'Enter') {
        const cmd = document.getElementById('aiInput').value.trim();
        if (!cmd) return;
        document.getElementById('aiInput').value = '';
        const pill = document.getElementById('telemetryPill');
        pill.innerText = `⚡ AI AGENT [LAYER ${activeLayer}] EXECUTING: "${cmd.toUpperCase()}" ...`;

        if (cmd.toLowerCase().includes('studio')) {
          launchApp({ name: 'Zoth Studio', exec: '/opt/zoth-studio/launch.sh' });
        } else if (cmd.toLowerCase().includes('pentest') || cmd.toLowerCase().includes('sec')) {
          launchApp({ name: 'Security Arsenal', exec: 'xfce4-terminal -e zoth-sec' });
        } else if (cmd.toLowerCase().includes('agent')) {
          launchApp({ name: 'Zoth Agent HUD', exec: '/usr/local/bin/zoth-agent-hud' });
        } else {
          fetch('http://127.0.0.1:8199/api/agent?prompt=' + encodeURIComponent(cmd)).catch(() => {});
        }

        setTimeout(() => {
          pill.innerText = `● 3D SPATIAL ENGINE ACTIVE | 60 FPS | 1-4 JUMP ZONES | DRAG TO ORBIT`;
        }, 3500);
      }
    }

    function launchApp(app) {
      fetch('http://127.0.0.1:8199/api/launch?cmd=' + encodeURIComponent(app.exec)).catch(() => {});
      const pill = document.getElementById('telemetryPill');
      pill.innerText = `⚡ ENGAGING [${app.name.toUpperCase()}] IN 3D SPACE ...`;
      setTimeout(() => {
        pill.innerText = `● 3D SPATIAL ENGINE ACTIVE | 60 FPS | 1-4 JUMP ZONES | DRAG TO ORBIT`;
      }, 3000);
    }

    function exitSpatialOS() {
      if (window.opener) window.close();
      else window.location.href = "about:blank";
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') exitSpatialOS();
      if (e.key === '1') focusZone('agents', 0);
      if (e.key === '2') focusZone('security', 1);
      if (e.key === '3') focusZone('terminal', 2);
      if (e.key === '4') focusZone('studio', 3);
      if (e.key === '`' || (e.ctrlKey && e.code === 'Space')) {
        document.getElementById('aiInput').focus();
      }
    });

    // ── THREE.JS 3D SCENE SETUP ────────────────────────────────────────────
    let scene, camera, renderer, controls;
    let interactiveMeshes = [];
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let hoveredMesh = null;

    const PALETTES = {
      emerald: { primary: 0x00ff88, secondary: 0x00f3ff, bg: 0x02040a, star: 0x6ee7b7 },
      ghost:   { primary: 0xc084fc, secondary: 0xa855f7, bg: 0x07030e, star: 0xe9d5ff },
      gold:    { primary: 0xfbbf24, secondary: 0xf59e0b, bg: 0x0d0902, star: 0xfef08a },
      cyan:    { primary: 0x00f3ff, secondary: 0x38bdf8, bg: 0x020a14, star: 0xbae6fd }
    };
    let activePalette = PALETTES.emerald;

    let targetCameraPos = new THREE.Vector3(0, 10, 52);
    let targetLookAt = new THREE.Vector3(0, 0, 0);

    function focusZone(zoneKey, btnIdx) {
      const zone = ZONES[zoneKey];
      if (!zone) return;
      targetCameraPos.copy(zone.cameraPos);
      targetLookAt.copy(zone.lookAt);

      document.querySelectorAll('.zone-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === btnIdx);
      });
    }

    function init() {
      const container = document.getElementById('webgl-canvas');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(activePalette.bg);
      scene.fog = new THREE.FogExp2(activePalette.bg, 0.0035);

      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 10, 52);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxDistance = 160;
      controls.minDistance = 15;

      // Lights
      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const pLight1 = new THREE.PointLight(activePalette.primary, 3, 220);
      pLight1.position.set(0, 30, 0);
      scene.add(pLight1);

      // 1. Grid Floor
      const grid = new THREE.GridHelper(300, 60, activePalette.primary, 0x1e293b);
      grid.position.y = -10;
      scene.add(grid);

      // 2. Starfield & Particles
      buildStarfield();

      // 3. Central AI Azoth Core
      buildCentralOrb();

      // 4. Build All 3D Workstation Windows & App Holograms
      buildWorkstations();

      // 5. Periodic Telemetry Fetch
      setInterval(fetchMetrics, 3000);

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('click', onMouseClick);
    }

    function fetchMetrics() {
      fetch('http://127.0.0.1:8199/api/metrics')
        .then(r => r.json())
        .then(data => {
          if (data && data.cpu_pct !== undefined) {
            document.getElementById('telemetryPill').innerText = 
              `● 3D OS ACTIVE | CPU: ${data.cpu_pct}% | RAM: ${data.ram_used_gb}/${data.ram_total_gb}GB (${data.ram_pct}%) | LAYER ${data.active_layer}`;
          }
        })
        .catch(() => {});
    }

    function buildStarfield() {
      const geo = new THREE.BufferGeometry();
      const count = 1800;
      const pos = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i += 3) {
        pos[i] = (Math.random() - 0.5) * 400;
        pos[i + 1] = (Math.random() - 0.5) * 400;
        pos[i + 2] = (Math.random() - 0.5) * 400;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({ size: 1.5, color: activePalette.star, transparent: true, opacity: 0.8 });
      scene.add(new THREE.Points(geo, mat));
    }

    let orbGroup;
    function buildCentralOrb() {
      orbGroup = new THREE.Group();
      
      const coreGeo = new THREE.IcosahedronGeometry(6, 2);
      const coreMat = new THREE.MeshStandardMaterial({
        color: activePalette.primary,
        wireframe: true,
        emissive: activePalette.primary,
        emissiveIntensity: 0.9
      });
      const core = new THREE.Mesh(coreGeo, coreMat);
      orbGroup.add(core);

      const r1Geo = new THREE.TorusGeometry(10, 0.35, 16, 100);
      const r1Mat = new THREE.MeshBasicMaterial({ color: activePalette.secondary });
      const r1 = new THREE.Mesh(r1Geo, r1Mat);
      r1.rotation.x = Math.PI / 3;
      orbGroup.add(r1);

      const r2Geo = new THREE.TorusGeometry(13, 0.3, 16, 100);
      const r2Mat = new THREE.MeshBasicMaterial({ color: 0xfbbf24 });
      const r2 = new THREE.Mesh(r2Geo, r2Mat);
      r2.rotation.y = Math.PI / 4;
      orbGroup.add(r2);

      scene.add(orbGroup);
    }

    function create3DCardCanvas(item) {
      const cv = document.createElement('canvas');
      cv.width = 512;
      cv.height = 360;
      const ctx = cv.getContext('2d');

      // Card Background Glass
      ctx.fillStyle = 'rgba(6, 14, 26, 0.94)';
      ctx.roundRect(10, 10, 492, 340, 24);
      ctx.fill();

      // Border Glow
      ctx.strokeStyle = '#00ff88';
      ctx.lineWidth = 6;
      ctx.roundRect(10, 10, 492, 340, 24);
      ctx.stroke();

      // Titlebar Bar
      ctx.fillStyle = 'rgba(0, 255, 136, 0.15)';
      ctx.roundRect(10, 10, 492, 60, [24, 24, 0, 0]);
      ctx.fill();

      // App Icon Symbol
      ctx.font = 'bold 64px monospace';
      ctx.fillStyle = '#00f3ff';
      ctx.textAlign = 'center';
      ctx.fillText(item.icon, 256, 140);

      // Title
      ctx.font = 'bold 30px "JetBrains Mono", monospace';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(item.name, 256, 205);

      // Description
      ctx.font = '18px "JetBrains Mono", monospace';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(item.desc.substring(0, 34), 256, 250);

      // Action Button
      ctx.fillStyle = 'rgba(0, 255, 136, 0.25)';
      ctx.roundRect(120, 280, 272, 44, 22);
      ctx.fill();
      ctx.strokeStyle = '#00ff88';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.font = 'bold 18px monospace';
      ctx.fillStyle = '#00ff88';
      ctx.fillText('▶ ENGAGE IN 3D', 256, 308);

      return cv;
    }

    function buildWorkstations() {
      Object.keys(ZONES).forEach((zoneKey) => {
        const zone = ZONES[zoneKey];
        zone.items.forEach((item) => {
          const cv = create3DCardCanvas(item);
          const texture = new THREE.CanvasTexture(cv);
          texture.minFilter = THREE.LinearFilter;

          const geo = new THREE.PlaneGeometry(8.0, 5.6);
          const mat = new THREE.MeshStandardMaterial({
            map: texture,
            transparent: true,
            side: THREE.DoubleSide,
            roughness: 0.3,
            metalness: 0.2
          });

          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(item.pos[0], item.pos[1], item.pos[2]);
          mesh.lookAt(mesh.position.x, mesh.position.y, mesh.position.z + 10);
          mesh.userData = { app: item, baseScale: 1.0, origY: item.pos[1] };

          interactiveMeshes.push(mesh);
          scene.add(mesh);
        });
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function onMouseMove(e) {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshes);

      const tooltip = document.getElementById('targetTooltip');

      if (intersects.length > 0) {
        const hit = intersects[0].object;
        if (hoveredMesh !== hit) {
          if (hoveredMesh) hoveredMesh.scale.set(1, 1, 1);
          hoveredMesh = hit;
          hoveredMesh.scale.set(1.18, 1.18, 1.18);
        }

        const app = hit.userData.app;
        document.getElementById('ttTitle').innerText = app.name.toUpperCase();
        document.getElementById('ttDesc').innerText = app.desc;
        tooltip.classList.add('active');
        document.body.style.cursor = 'pointer';
      } else {
        if (hoveredMesh) {
          hoveredMesh.scale.set(1, 1, 1);
          hoveredMesh = null;
        }
        tooltip.classList.remove('active');
        document.body.style.cursor = 'default';
      }
    }

    function onMouseClick(e) {
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshes);
      if (intersects.length > 0) {
        const app = intersects[0].object.userData.app;
        launchApp(app);
      }
    }

    function changeTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      activePalette = PALETTES[theme] || PALETTES.emerald;
      if (scene) {
        scene.background.setHex(activePalette.bg);
        scene.fog.color.setHex(activePalette.bg);
      }
    }

    // ── ANIMATION & CAMERA INTERPOLATION LOOP ──────────────────────────────
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      // Smooth Camera Lerp across zones
      camera.position.lerp(targetCameraPos, 0.04);
      controls.target.lerp(targetLookAt, 0.04);
      controls.update();

      if (orbGroup) {
        orbGroup.children[0].rotation.x += 0.01;
        orbGroup.children[0].rotation.y += 0.014;
        orbGroup.children[1].rotation.x += 0.018;
        orbGroup.children[2].rotation.y += 0.012;
      }

      // Floating wave animation on 3D windows
      const time = clock.getElapsedTime();
      interactiveMeshes.forEach((mesh, idx) => {
        mesh.position.y = mesh.userData.origY + Math.sin(time * 2 + idx) * 0.4;
      });

      renderer.render(scene, camera);
    }

    init();
    animate();
  </script>
</body>
</html>
