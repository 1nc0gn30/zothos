<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Zoth Studio Hermetic Cyber Seal">
  <title>Zoth Studio — Hermetic Cyber Seal</title>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1024" />
      <stop offset="60%" stop-color="#04060d" />
      <stop offset="100%" stop-color="#010204" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyan to Gold Linear Gradient -->
    <linearGradient id="cyanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="goldCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Base Disc -->
  <circle cx="256" cy="256" r="252" fill="url(#bgGrad)" stroke="#00e5ff" stroke-width="2.5" opacity="0.9" />

  <!-- Outer Concentric Alchemical Rings -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="256" r="236" stroke="url(#cyanGold)" stroke-width="1.8" filter="url(#softGlow)" />
    <circle cx="256" cy="256" r="222" stroke="#00e5ff" stroke-width="3" filter="url(#neonGlow)" />
    <circle cx="256" cy="256" r="208" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.8" />
    <circle cx="256" cy="256" r="192" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    <circle cx="256" cy="256" r="148" stroke="#a855f7" stroke-width="1" stroke-dasharray="6 8" opacity="0.7" />
    <circle cx="256" cy="256" r="88" stroke="#00e5ff" stroke-width="1.5" opacity="0.5" />
  </g>

  <!-- Cardinal Compass Runic Ticks -->
  <g stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)">
    <line x1="256" y1="8" x2="256" y2="34" />
    <line x1="256" y1="478" x2="256" y2="504" />
    <line x1="8" y1="256" x2="34" y2="256" />
    <line x1="478" y1="256" x2="504" y2="256" />
    <!-- Diagonal Ticks -->
    <line x1="80" y1="80" x2="98" y2="98" stroke="#fbbf24" stroke-width="1.8" />
    <line x1="432" y1="80" x2="414" y2="98" stroke="#fbbf24" stroke-width="1.8" />
    <line x1="80" y1="432" x2="98" y2="414" stroke="#fbbf24" stroke-width="1.8" />
    <line x1="432" y1="432" x2="414" y2="414" stroke="#fbbf24" stroke-width="1.8" />
  </g>

  <!-- Primary Sacred Hexagram Geometry -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)">
    <!-- Upward Triangle (Gold / Solar) -->
    <polygon points="256,54 428,352 84,352" stroke="url(#cyanGold)" stroke-width="3.5" />
    <polygon points="256,70 412,340 100,340" stroke="#00e5ff" stroke-width="1.2" opacity="0.7" />

    <!-- Downward Triangle (Cyan / Lunar) -->
    <polygon points="256,458 84,160 428,160" stroke="url(#goldCyan)" stroke-width="3.5" />
    <polygon points="256,442 100,172 412,172" stroke="#fbbf24" stroke-width="1.2" opacity="0.7" />
  </g>

  <!-- Inner Hermetic Symbols & Sacred Runic Nodes -->
  <g fill="none" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" filter="url(#softGlow)">
    <!-- Top Apex Node -->
    <circle cx="256" cy="116" r="8" fill="#04060d" stroke="#fbbf24" stroke-width="2" />
    <line x1="256" y1="94" x2="256" y2="108" stroke="#fbbf24" />
    
    <!-- Left & Right Lateral Nodes -->
    <circle cx="140" cy="256" r="6" fill="#04060d" stroke="#00e5ff" stroke-width="1.8" />
    <circle cx="372" cy="256" r="6" fill="#04060d" stroke="#00e5ff" stroke-width="1.8" />
    <circle cx="256" cy="396" r="7" fill="#04060d" stroke="#38bdf8" stroke-width="1.8" />
  </g>

  <!-- Central Stylized Cybernetic Owl Mask & Optics -->
  <!-- Owl Brow & Crest -->
  <path d="M192,204 Q256,236 320,204 Q300,182 256,190 Q212,182 192,204 Z" 
        fill="#070c18" stroke="#fbbf24" stroke-width="2.5" filter="url(#softGlow)" />
  
  <path d="M256,156 L268,188 L244,188 Z" fill="#00e5ff" filter="url(#neonGlow)" />
  <line x1="256" y1="130" x2="256" y2="156" stroke="#00e5ff" stroke-width="2.5" />

  <!-- Luminous Owl Eyes -->
  <!-- Left Eye -->
  <g filter="url(#neonGlow)">
    <circle cx="206" cy="252" r="28" fill="#040711" stroke="#00e5ff" stroke-width="3" />
    <circle cx="206" cy="252" r="18" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3" />
    <circle cx="206" cy="252" r="10" fill="#00e5ff" />
    <circle cx="208" cy="250" r="4" fill="#ffffff" />
    <!-- Eye Circuit Traces -->
    <path d="M178,252 L154,252 L146,264" fill="none" stroke="#00e5ff" stroke-width="2" />
    <path d="M206,280 L206,298 L194,310" fill="none" stroke="#00e5ff" stroke-width="1.8" />
  </g>

  <!-- Right Eye -->
  <g filter="url(#neonGlow)">
    <circle cx="306" cy="252" r="28" fill="#040711" stroke="#00e5ff" stroke-width="3" />
    <circle cx="306" cy="252" r="18" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3" />
    <circle cx="306" cy="252" r="10" fill="#00e5ff" />
    <circle cx="308" cy="250" r="4" fill="#ffffff" />
    <!-- Eye Circuit Traces -->
    <path d="M334,252 L358,252 L366,264" fill="none" stroke="#00e5ff" stroke-width="2" />
    <path d="M306,280 L306,298 L318,310" fill="none" stroke="#00e5ff" stroke-width="1.8" />
  </g>

  <!-- Cyber Beak & Nasal Bridge -->
  <polygon points="256,238 268,284 256,312 244,284" fill="#070c1a" stroke="#fbbf24" stroke-width="2.5" filter="url(#softGlow)" />
  <line x1="256" y1="238" x2="256" y2="312" stroke="#00e5ff" stroke-width="1.8" />

  <!-- Lower Runic Mantle / Feathers -->
  <g fill="none" stroke="url(#cyanGold)" stroke-width="2.2" stroke-linecap="round" filter="url(#softGlow)">
    <path d="M166,290 C188,328 230,350 256,350 C282,350 324,328 346,290" />
    <path d="M196,330 Q256,378 316,330" stroke-width="1.8" stroke="#00e5ff" />
    <path d="M226,364 Q256,396 286,364" stroke-width="2.2" stroke="#fbbf24" />
  </g>

  <!-- Brand Typography Arc / Monogram -->
  <text x="256" y="430" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="22" font-weight="900" 
        letter-spacing="12" fill="#00e5ff" text-anchor="middle" filter="url(#neonGlow)">ZOTH</text>
  <text x="256" y="450" font-family="system-ui, sans-serif" font-size="9" font-weight="700" 
        letter-spacing="4" fill="#fbbf24" text-anchor="middle" opacity="0.9">NULLAI STUDIO</text>
</svg>
