<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Zoth Studio hermetic seal">
  <title>Zoth Studio — Hermetic Seal</title>
  <desc>Line-only geometric face inside a hexagram and double circle. Ready to digitize or cut as a mark.</desc>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer seal -->
    <circle cx="256" cy="256" r="238" stroke-width="3.2"/>
    <circle cx="256" cy="256" r="210" stroke-width="2.4"/>

    <!-- Compass ticks -->
    <g stroke-width="2">
      <path d="M256 20 V44 M256 468 V492 M20 256 H44 M468 256 H492"/>
      <path d="M87.4 87.4 l16.97 16.97 M407.63 407.63 l16.97 16.97 M87.4 424.6 l16.97-16.97 M407.63 104.37 l16.97-16.97"/>
    </g>
    <g stroke-width="1.4">
      <path d="M256 22 v14 M320.7 30.7 l-4.1 13.4 M380.1 56.1 l-8 11.5 M428 104 l-11.5 8 M455.3 163.3 l-13.4 4.1 M490 256 h-14 M455.3 348.7 l-13.4-4.1 M428 408 l-11.5-8 M380.1 455.9 l-8-11.5 M320.7 481.3 l-4.1-13.4 M191.3 481.3 l4.1-13.4 M131.9 455.9 l8-11.5 M84 408 l11.5-8 M56.7 348.7 l13.4-4.1 M22 256 h14 M56.7 163.3 l13.4 4.1 M84 104 l11.5 8 M131.9 56.1 l8 11.5 M191.3 30.7 l4.1 13.4"/>
    </g>

    <!-- Hexagram on r=188 -->
    <path stroke-width="2.2" d="M256 68 L418.8 350 H93.2 Z"/>
    <path stroke-width="2.2" d="M256 444 L93.2 162 H418.8 Z"/>

    <!-- Inner diamond hint -->
    <path stroke-width="1.1" opacity="0.7" d="M256 118 L394 256 L256 394 L118 256 Z"/>

    <!-- Third-eye triangle -->
    <path stroke-width="1.8" d="M256 146 L278 184 H234 Z"/>
    <path stroke-width="1.2" d="M256 156 L270 178 H242 Z"/>
    <circle cx="256" cy="172" r="3.2" stroke-width="1.2"/>

    <!-- Z-brow (the mark) -->
    <path stroke-width="2.4" d="M198 196 H256 L232 222 H314"/>

    <!-- Eyes -->
    <path stroke-width="1.8" d="M168 236 C186 218 226 218 238 236 C226 254 186 254 168 236 Z"/>
    <path stroke-width="1.8" d="M274 236 C286 218 326 218 344 236 C326 254 286 254 274 236 Z"/>
    <circle cx="204" cy="236" r="6.5" stroke-width="1.6"/>
    <circle cx="308" cy="236" r="6.5" stroke-width="1.6"/>
    <path stroke-width="1.2" d="M156 236 H168 M344 236 H356"/>

    <!-- Nose -->
    <path stroke-width="2" d="M256 186 V268"/>
    <path stroke-width="1.5" d="M256 268 C248 276 238 280 228 278"/>
    <path stroke-width="1.5" d="M256 268 C264 276 274 280 284 278"/>
    <path stroke-width="1.1" d="M246 252 L256 268 L266 252" opacity="0.85"/>

    <!-- Mouth + chin -->
    <path stroke-width="1.8" d="M214 312 C232 304 280 304 298 312"/>
    <path stroke-width="1.4" d="M222 328 C240 338 272 338 290 328"/>
    <path stroke-width="1.3" d="M236 356 Q256 372 276 356"/>

    <!-- Cheek construction lines -->
    <path stroke-width="1" opacity="0.65" d="M204 258 L214 300 M308 258 L298 300"/>
  </g>
</svg>
