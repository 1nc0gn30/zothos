<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none" role="img" aria-label="Master Azoth Sovereign Alchemical Seal Watermark">
  <defs>
    <linearGradient id="azGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="azCyanGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>
    <filter id="azGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Astrolabe Rings -->
  <g stroke="url(#azGoldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="300" cy="300" r="280" stroke-width="1.8" opacity="0.4" stroke-dasharray="4 8" />
    <circle cx="300" cy="300" r="264" stroke-width="2.4" opacity="0.75" />
    <circle cx="300" cy="300" r="248" stroke-width="1.2" opacity="0.5" stroke-dasharray="2 6" />
    <circle cx="300" cy="300" r="228" stroke-width="1.6" opacity="0.65" />
  </g>

  <!-- 36-Degree Alchemical Compass Ticks -->
  <g stroke="url(#azCyanGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.65">
    <!-- Cardinal Ticks -->
    <line x1="300" y1="20" x2="300" y2="48" stroke-width="2.5" />
    <line x1="300" y1="552" x2="300" y2="580" stroke-width="2.5" />
    <line x1="20" y1="300" x2="48" y2="300" stroke-width="2.5" />
    <line x1="552" y1="300" x2="580" y2="300" stroke-width="2.5" />
    
    <!-- Diagonal Major Ticks -->
    <line x1="102" y1="102" x2="122" y2="122" stroke-width="2" />
    <line x1="498" y1="498" x2="478" y2="478" stroke-width="2" />
    <line x1="102" y1="498" x2="122" y2="478" stroke-width="2" />
    <line x1="498" y1="102" x2="478" y2="122" stroke-width="2" />

    <!-- Intermediate Rays -->
    <path d="M 300 24 v 12 M 372 33 l -4 11 M 438 60 l -7 10 M 490 102 l -10 7 M 520 156 l -11 4 M 530 216 l -12 2 M 530 384 l -12 -2 M 520 444 l -11 -4 M 490 498 l -10 -7 M 438 540 l -7 -10 M 372 567 l -4 -11 M 228 567 l 4 -11 M 162 540 l 7 -10 M 110 498 l 10 -7 M 80 444 l 11 -4 M 70 384 l 12 -2 M 70 216 l 12 2 M 80 156 l 11 4 M 110 102 l 10 7 M 162 60 l 7 10 M 228 33 l 4 11" opacity="0.45" />
  </g>

  <!-- Sacred Hexagram Geometry (Gold Solar + Cyan Lunar) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#azGlow)">
    <!-- Upward Triangle (Gold Solar Spirit) -->
    <polygon points="300,92 480,404 120,404" stroke="url(#azGoldGrad)" stroke-width="2.2" />
    <polygon points="300,108 464,392 136,392" stroke="url(#azGoldGrad)" stroke-width="0.9" opacity="0.4" />

    <!-- Downward Triangle (Cyan Lunar Intellect) -->
    <polygon points="300,508 120,196 480,196" stroke="url(#azCyanGrad)" stroke-width="2.2" />
    <polygon points="300,492 136,208 464,208" stroke="url(#azCyanGrad)" stroke-width="0.9" opacity="0.4" />
  </g>

  <!-- Inner Diamond & Orbital Runic Nodes -->
  <g fill="none" stroke="url(#azGoldGrad)" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
    <polygon points="300,146 454,300 300,454 146,300" stroke-width="1.2" stroke-dasharray="6 4" />
    <circle cx="300" cy="146" r="5" fill="#fbbf24" opacity="0.8" />
    <circle cx="454" cy="300" r="5" fill="#00f0ff" opacity="0.8" />
    <circle cx="300" cy="454" r="5" fill="#fbbf24" opacity="0.8" />
    <circle cx="146" cy="300" r="5" fill="#00f0ff" opacity="0.8" />
  </g>

  <!-- Master Azoth Hermetic Center Core -->
  <g fill="none" stroke="url(#azGoldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Third-Eye Triangle & Radiant Pupil -->
    <polygon points="300,176 324,216 276,216" stroke-width="1.8" />
    <polygon points="300,188 314,210 286,210" stroke-width="1" opacity="0.6" />
    <circle cx="300" cy="204" r="3" fill="#fbbf24" />

    <!-- Master Azoth Z-Slash Brow Mark -->
    <path d="M 238 230 H 300 L 274 258 H 362" stroke="url(#azCyanGrad)" stroke-width="2.8" filter="url(#azGlow)" />

    <!-- Sovereign Eyes -->
    <path d="M 204 274 C 224 254 268 254 282 274 C 268 294 224 294 204 274 Z" stroke-width="1.8" />
    <path d="M 318 274 C 332 254 376 254 396 274 C 376 294 332 294 318 274 Z" stroke-width="1.8" />
    <circle cx="244" cy="274" r="6" fill="#00f0ff" opacity="0.75" />
    <circle cx="356" cy="274" r="6" fill="#00f0ff" opacity="0.75" />
    <line x1="192" y1="274" x2="204" y2="274" stroke-width="1.4" opacity="0.6" />
    <line x1="396" y1="274" x2="408" y2="274" stroke-width="1.4" opacity="0.6" />

    <!-- Nose & Alchemical Synthesis Bridge -->
    <path d="M 300 220 V 310" stroke-width="2" />
    <path d="M 300 310 C 290 320 278 324 266 322" stroke-width="1.6" />
    <path d="M 300 310 C 310 320 322 324 334 322" stroke-width="1.6" />
    <polygon points="290,292 300,310 310,292" stroke-width="1" opacity="0.7" />

    <!-- Sovereign Mouth & Alchemical Coagulation Arc -->
    <path d="M 252 358 C 272 350 328 350 348 358" stroke-width="1.8" />
    <path d="M 262 376 C 282 386 318 386 338 376" stroke-width="1.4" />
    <path d="M 278 406 Q 300 424 322 406" stroke-width="1.4" />

    <!-- Geometric Construction Guides -->
    <path d="M 244 298 L 254 346 M 356 298 L 346 346" stroke-width="1" opacity="0.4" stroke-dasharray="3 3" />
  </g>
</svg>