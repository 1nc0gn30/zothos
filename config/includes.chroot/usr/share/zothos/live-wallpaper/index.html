<!DOCTYPE html>
<html lang="en" data-theme="emerald">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZOTHOS // 3D LIGHTWEIGHT THREE.JS FX ENGINE</title>
  <!-- Local Offline Three.js & Controls -->
  <script src="./vendor/three.min.js"></script>
  <script src="./vendor/OrbitControls.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    :root {
      --bg: #02040a;
      --accent: #00ff88;
      --accent-rgb: 0, 255, 136;
      --accent2: #00f3ff;
      --accent2-rgb: 0, 243, 255;
      --gold: #fbbf24;
      --purple: #a855f7;
      --fg: #ecfdf5;
      --card-bg: rgba(2, 8, 18, 0.88);
      --border: rgba(0, 255, 136, 0.4);
      --glow: 0 0 25px rgba(0, 255, 136, 0.5);
      --font-mono: 'JetBrains Mono', 'Share Tech Mono', 'DejaVu Sans Mono', monospace;
    }

    [data-theme="ghost"] {
      --accent: #c084fc;
      --accent-rgb: 192, 132, 252;
      --accent2: #a855f7;
      --fg: #faf5ff;
      --card-bg: rgba(12, 4, 24, 0.90);
      --border: rgba(168, 85, 247, 0.45);
      --glow: 0 0 25px rgba(168, 85, 247, 0.55);
    }

    [data-theme="gold"] {
      --accent: #fbbf24;
      --accent-rgb: 251, 191, 36;
      --accent2: #f59e0b;
      --fg: #fefce8;
      --card-bg: rgba(20, 14, 2, 0.90);
      --border: rgba(251, 191, 36, 0.45);
      --glow: 0 0 25px rgba(251, 191, 36, 0.55);
    }

    [data-theme="cyan"] {
      --accent: #00f3ff;
      --accent-rgb: 0, 243, 255;
      --accent2: #38bdf8;
      --fg: #f0fdfa;
      --card-bg: rgba(2, 14, 28, 0.90);
      --border: rgba(0, 243, 255, 0.45);
      --glow: 0 0 25px rgba(0, 243, 255, 0.55);
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font-mono);
      color: var(--fg);
    }

    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #canvas2d-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: none;
    }

    /* CRT Scanline & Subtle Glitch Overlay */
    .crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
      background-size: 100% 3px, 4px 100%;
    }

    /* Top Action Bar (Persistent Exit & Fullscreen) */
    .top-action-bar {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      pointer-events: auto;
    }

    .brand-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6), var(--glow);
    }

    .brand-pill .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(0.85); opacity: 0.7; }
      100% { transform: scale(1.25); opacity: 1; }
    }

    .brand-pill span {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--accent);
    }

    .exit-controls {
      display: flex;
      gap: 10px;
    }

    .btn-exit {
      background: rgba(239, 68, 68, 0.25);
      border: 1px solid rgba(239, 68, 68, 0.7);
      color: #fca5a5;
      padding: 8px 18px;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
    }

    .btn-exit:hover {
      background: rgba(239, 68, 68, 0.9);
      color: #ffffff;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
      transform: translateY(-1px);
    }

    .btn-fullscreen {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 8px 16px;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
    }

    .btn-fullscreen:hover {
      background: var(--accent);
      color: #02040a;
      box-shadow: var(--glow);
    }

    /* Floating Draggable Control HUD */
    .hud-window {
      position: absolute;
      top: 75px;
      right: 20px;
      width: 360px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), var(--glow);
      z-index: 50;
    }

    .hud-header {
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid var(--border);
      border-radius: 12px 12px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: move;
    }

    .hud-title {
      font-size: 12px;
      font-weight: bold;
      color: var(--accent);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hud-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent2);
      margin-bottom: 4px;
    }

    .mode-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--fg);
      padding: 8px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(0, 255, 136, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn.active {
      background: var(--accent);
      color: #02040a;
      border-color: var(--accent);
      font-weight: bold;
      box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.6);
    }

    .theme-picker {
      display: flex;
      gap: 8px;
    }

    .theme-dot {
      flex: 1;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .theme-dot:hover {
      transform: scale(1.05);
      border-color: #fff;
    }

    .dot-emerald { background: #00ff88; }
    .dot-ghost { background: #c084fc; }
    .dot-gold { background: #fbbf24; }
    .dot-cyan { background: #00f3ff; }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #94a3b8;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 8px var(--accent);
    }

    .hint-bar {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 11px;
      color: #94a3b8;
      backdrop-filter: blur(12px);
      z-index: 40;
      pointer-events: none;
    }
    .hint-bar kbd {
      background: rgba(255,255,255,0.1);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- WebGL Three.js Container -->
  <div id="webgl-container"></div>

  <!-- Fallback 2D Canvas Container -->
  <canvas id="canvas2d-container"></canvas>

  <div class="crt-overlay"></div>

  <!-- Persistent Top Action Bar -->
  <div class="top-action-bar">
    <div class="brand-pill">
      <div class="pulse-dot"></div>
      <span>ZOTHOS // 3D THREE.JS FX ENGINE</span>
    </div>
    <div class="exit-controls">
      <button class="btn-fullscreen" onclick="toggleFullscreen()" title="Toggle Fullscreen (F)">⛶ FULLSCREEN</button>
      <button class="btn-exit" onclick="exitLiveWallpaper()" title="Exit & Return to Desktop (ESC)">✕ EXIT ENGINE [ESC]</button>
    </div>
  </div>

  <!-- Floating Draggable Control HUD -->
  <div class="hud-window" id="hudWindow">
    <div class="hud-header" id="hudHeader">
      <div class="hud-title">⚡ 3D SCENE & FX CONTROLLER</div>
      <span style="font-size: 10px; color: #94a3b8;">DRAG TO MOVE</span>
    </div>
    <div class="hud-body">
      <div>
        <div class="section-title">Visual Paradigm</div>
        <div class="mode-buttons">
          <button class="btn active" onclick="setVisualMode('3d-orb')">3D Azoth Orb</button>
          <button class="btn" onclick="setVisualMode('3d-grid')">3D Cyber Grid</button>
          <button class="btn" onclick="setVisualMode('3d-emblem')">3D Golden Z</button>
          <button class="btn" onclick="setVisualMode('matrix')">Matrix Rain</button>
          <button class="btn" onclick="setVisualMode('datamosh')">Datamosh</button>
        </div>
      </div>

      <div>
        <div class="section-title">Aura Theme</div>
        <div class="theme-picker">
          <div class="theme-dot dot-emerald" onclick="changeTheme('emerald')" title="Emerald Matrix"></div>
          <div class="theme-dot dot-ghost" onclick="changeTheme('ghost')" title="Ghost Amethyst"></div>
          <div class="theme-dot dot-gold" onclick="changeTheme('gold')" title="Celestial Gold"></div>
          <div class="theme-dot dot-cyan" onclick="changeTheme('cyan')" title="Electric Cyan"></div>
        </div>
      </div>

      <div class="slider-group">
        <div class="slider-label">
          <span>Simulation Speed</span>
          <span id="speedVal">1.0x</span>
        </div>
        <input type="range" id="speedSlider" min="2" max="30" value="10" oninput="updateSliders()">
      </div>

      <div class="slider-group">
        <div class="slider-label">
          <span>Particle & Glow Depth</span>
          <span id="glowVal">100%</span>
        </div>
        <input type="range" id="glowSlider" min="10" max="200" value="100" oninput="updateSliders()">
      </div>

      <button class="btn-exit" style="width: 100%; justify-content: center; margin-top: 4px;" onclick="exitLiveWallpaper()">
        RETURN TO DESKTOP
      </button>
    </div>
  </div>

  <!-- Bottom keyboard hints -->
  <div class="hint-bar">
    <kbd>ESC</kbd> Exit &nbsp;•&nbsp; <kbd>SPACE</kbd> HUD &nbsp;•&nbsp; <kbd>F</kbd> Fullscreen &nbsp;•&nbsp; <kbd>1-5</kbd> Switch 3D/2D Modes &nbsp;•&nbsp; Click+Drag to Orbit 3D
  </div>

  <script>
    // ── EXIT HANDLING ───────────────────────────────────────────────────────
    function exitLiveWallpaper() {
      if (window.opener) {
        window.close();
      } else {
        window.close();
        window.location.href = "about:blank";
      }
    }

    // Global Keybinds
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key === 'q' || e.key === 'Q') {
        exitLiveWallpaper();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      } else if (e.key === ' ' || e.code === 'Space') {
        toggleHud();
      } else if (e.key === '1') {
        setVisualMode('3d-orb');
      } else if (e.key === '2') {
        setVisualMode('3d-grid');
      } else if (e.key === '3') {
        setVisualMode('3d-emblem');
      } else if (e.key === '4') {
        setVisualMode('matrix');
      } else if (e.key === '5') {
        setVisualMode('datamosh');
      }
    });

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }
    }

    function toggleHud() {
      const hud = document.getElementById('hudWindow');
      hud.style.display = hud.style.display === 'none' ? 'block' : 'none';
    }

    // ── 3D THREE.JS SCENE SETUP ────────────────────────────────────────────
    let scene, camera, renderer, controls;
    let currentMode = '3d-orb';
    let speed = 1.0;
    let glowScale = 1.0;

    const webglContainer = document.getElementById('webgl-container');
    const canvas2d = document.getElementById('canvas2d-container');
    const ctx2d = canvas2d.getContext('2d');

    // Color theme map for Three.js
    const PALETTES = {
      emerald: { primary: 0x00ff88, secondary: 0x00f3ff, bg: 0x02040a, particles: 0x6ee7b7 },
      ghost:   { primary: 0xc084fc, secondary: 0xa855f7, bg: 0x07030e, particles: 0xe9d5ff },
      gold:    { primary: 0xfbbf24, secondary: 0xf59e0b, bg: 0x0d0902, particles: 0xfef08a },
      cyan:    { primary: 0x00f3ff, secondary: 0x38bdf8, bg: 0x020a14, particles: 0xbae6fd }
    };

    let activePalette = PALETTES.emerald;

    // 3D Objects
    let orbGroup, gridGroup, emblemGroup, starPoints;

    function initThree() {
      if (!window.THREE) return false;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(activePalette.bg);
      scene.fog = new THREE.FogExp2(activePalette.bg, 0.002);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 80);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      webglContainer.appendChild(renderer.domElement);

      if (window.THREE.OrbitControls) {
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 250;
        controls.minDistance = 20;
      }

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const pointLight1 = new THREE.PointLight(activePalette.primary, 3, 200);
      pointLight1.position.set(40, 40, 50);
      scene.add(pointLight1);

      const pointLight2 = new THREE.PointLight(activePalette.secondary, 2, 200);
      pointLight2.position.set(-40, -40, -50);
      scene.add(pointLight2);

      buildStarfield();
      buildOrbScene();
      buildGridScene();
      buildEmblemScene();

      updateSceneVisibility();
      return true;
    }

    // 1. Particle Starfield
    function buildStarfield() {
      const starGeo = new THREE.BufferGeometry();
      const starCount = 1200;
      const starPos = new Float32Array(starCount * 3);

      for (let i = 0; i < starCount * 3; i += 3) {
        starPos[i] = (Math.random() - 0.5) * 400;
        starPos[i + 1] = (Math.random() - 0.5) * 400;
        starPos[i + 2] = (Math.random() - 0.5) * 400;
      }

      starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
      const starMat = new THREE.PointsMaterial({
        size: 1.5,
        color: activePalette.particles,
        transparent: true,
        opacity: 0.8
      });

      starPoints = new THREE.Points(starGeo, starMat);
      scene.add(starPoints);
    }

    // 2. 3D Alchemical Synthesis Orb & Concentric Gyro Torus Rings
    function buildOrbScene() {
      orbGroup = new THREE.Group();

      // Core Icosahedron Orb
      const coreGeo = new THREE.IcosahedronGeometry(14, 3);
      const coreMat = new THREE.MeshStandardMaterial({
        color: activePalette.primary,
        wireframe: true,
        emissive: activePalette.primary,
        emissiveIntensity: 0.5,
        roughness: 0.2
      });
      const coreMesh = new THREE.Mesh(coreGeo, coreMat);
      orbGroup.add(coreMesh);

      // Inner Glowing Sphere
      const innerGeo = new THREE.SphereGeometry(8, 32, 32);
      const innerMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        wireframe: false
      });
      const innerMesh = new THREE.Mesh(innerGeo, innerMat);
      orbGroup.add(innerMesh);

      // Concentric Rotating Torus Rings
      const torus1Geo = new THREE.TorusGeometry(22, 0.6, 16, 100);
      const torus1Mat = new THREE.MeshBasicMaterial({ color: activePalette.primary, wireframe: false });
      const torus1 = new THREE.Mesh(torus1Geo, torus1Mat);
      torus1.rotation.x = Math.PI / 4;
      orbGroup.add(torus1);

      const torus2Geo = new THREE.TorusGeometry(26, 0.5, 16, 100);
      const torus2Mat = new THREE.MeshBasicMaterial({ color: activePalette.secondary, wireframe: false });
      const torus2 = new THREE.Mesh(torus2Geo, torus2Mat);
      torus2.rotation.y = Math.PI / 3;
      orbGroup.add(torus2);

      const torus3Geo = new THREE.TorusGeometry(30, 0.4, 16, 100);
      const torus3Mat = new THREE.MeshBasicMaterial({ color: 0xfbbf24, wireframe: false });
      const torus3 = new THREE.Mesh(torus3Geo, torus3Mat);
      torus3.rotation.z = Math.PI / 6;
      orbGroup.add(torus3);

      scene.add(orbGroup);
    }

    // 3. 3D Cyber Netrunner Matrix Grid
    function buildGridScene() {
      gridGroup = new THREE.Group();

      const gridHelper = new THREE.GridHelper(300, 60, activePalette.primary, activePalette.secondary);
      gridHelper.position.y = -25;
      gridGroup.add(gridHelper);

      // Floating holographic data cubes
      for (let i = 0; i < 20; i++) {
        const boxGeo = new THREE.BoxGeometry(4, 4, 4);
        const boxMat = new THREE.MeshStandardMaterial({
          color: activePalette.primary,
          wireframe: true,
          emissive: activePalette.primary,
          emissiveIntensity: 0.6
        });
        const box = new THREE.Mesh(boxGeo, boxMat);
        box.position.set(
          (Math.random() - 0.5) * 160,
          Math.random() * 30 - 15,
          (Math.random() - 0.5) * 160
        );
        box.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
        gridGroup.add(box);
      }

      scene.add(gridGroup);
    }

    // 4. 3D Golden Z Emblem
    function buildEmblemScene() {
      emblemGroup = new THREE.Group();

      const zShape = new THREE.Shape();
      zShape.moveTo(-15, 18);
      zShape.lineTo(15, 18);
      zShape.lineTo(15, 10);
      zShape.lineTo(-3, -8);
      zShape.lineTo(15, -8);
      zShape.lineTo(15, -18);
      zShape.lineTo(-15, -18);
      zShape.lineTo(-15, -10);
      zShape.lineTo(3, 8);
      zShape.lineTo(-15, 8);
      zShape.closePath();

      const extrudeSettings = { depth: 5, bevelEnabled: true, bevelSegments: 4, steps: 2, bevelSize: 1, bevelThickness: 1 };
      const zGeo = new THREE.ExtrudeGeometry(zShape, extrudeSettings);
      const zMat = new THREE.MeshStandardMaterial({
        color: 0xfbbf24,
        metalness: 0.85,
        roughness: 0.25,
        emissive: 0x78350f,
        emissiveIntensity: 0.3
      });

      const zMesh = new THREE.Mesh(zGeo, zMat);
      zMesh.position.set(0, 0, -2.5);
      emblemGroup.add(zMesh);

      // Surrounding Hexagram Wireframe Ring
      const hexGeo = new THREE.TorusGeometry(26, 0.6, 6, 6);
      const hexMat = new THREE.MeshBasicMaterial({ color: activePalette.secondary, wireframe: true });
      const hexMesh = new THREE.Mesh(hexGeo, hexMat);
      emblemGroup.add(hexMesh);

      scene.add(emblemGroup);
    }

    function updateSceneVisibility() {
      if (!scene) return;
      orbGroup.visible = (currentMode === '3d-orb');
      gridGroup.visible = (currentMode === '3d-grid');
      emblemGroup.visible = (currentMode === '3d-emblem');

      if (currentMode === 'matrix' || currentMode === 'datamosh') {
        webglContainer.style.display = 'none';
        canvas2d.style.display = 'block';
      } else {
        webglContainer.style.display = 'block';
        canvas2d.style.display = 'none';
      }
    }

    // ── ANIMATION LOOP ─────────────────────────────────────────────────────
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta() * speed;

      if (currentMode.startsWith('3d')) {
        if (controls) controls.update();

        if (starPoints) {
          starPoints.rotation.y += 0.0008 * speed;
        }

        if (orbGroup && orbGroup.visible) {
          orbGroup.children[0].rotation.x += 0.008 * speed;
          orbGroup.children[0].rotation.y += 0.012 * speed;
          orbGroup.children[2].rotation.x += 0.015 * speed;
          orbGroup.children[3].rotation.y += 0.018 * speed;
          orbGroup.children[4].rotation.z += 0.012 * speed;
        }

        if (gridGroup && gridGroup.visible) {
          gridGroup.children[0].position.z = (gridGroup.children[0].position.z + 0.3 * speed) % 5;
          for (let i = 1; i < gridGroup.children.length; i++) {
            gridGroup.children[i].rotation.x += 0.01 * speed;
            gridGroup.children[i].rotation.y += 0.015 * speed;
          }
        }

        if (emblemGroup && emblemGroup.visible) {
          emblemGroup.rotation.y += 0.01 * speed;
          emblemGroup.children[1].rotation.z -= 0.015 * speed;
        }

        if (renderer && scene && camera) {
          renderer.render(scene, camera);
        }
      } else {
        if (currentMode === 'matrix') drawMatrix2D();
        else if (currentMode === 'datamosh') drawDatamosh2D();
      }
    }

    // ── 2D CANVAS FALLBACK / MATRIX ENGINE ──────────────────────────────────
    let drops2d = [];
    const fontSize = 16;
    let cols2d = 0;

    function resize2D() {
      canvas2d.width = window.innerWidth;
      canvas2d.height = window.innerHeight;
      cols2d = Math.floor(window.innerWidth / fontSize);
      drops2d = Array(cols2d).fill(1);
    }
    window.addEventListener('resize', () => {
      if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
      resize2D();
    });
    resize2D();

    const chars = '0123456789ABCDEFѰ🜂🜄🜁🜃ZOTHOSNULLAIΩΨλπµ§';

    function drawMatrix2D() {
      ctx2d.fillStyle = 'rgba(2, 4, 10, 0.08)';
      ctx2d.fillRect(0, 0, canvas2d.width, canvas2d.height);

      const computedStyle = getComputedStyle(document.documentElement);
      const accent = computedStyle.getPropertyValue('--accent').trim();

      ctx2d.font = `${fontSize}px 'JetBrains Mono', monospace`;

      for (let i = 0; i < drops2d.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        const x = i * fontSize;
        const y = drops2d[i] * fontSize;

        if (Math.random() > 0.85) ctx2d.fillStyle = '#ffffff';
        else ctx2d.fillStyle = accent;

        ctx2d.fillText(text, x, y);

        if (y > canvas2d.height && Math.random() > 0.975) {
          drops2d[i] = 0;
        }
        drops2d[i] += speed * 0.7;
      }
    }

    function drawDatamosh2D() {
      drawMatrix2D();
      if (Math.random() < 0.3) {
        const sliceH = Math.random() * 40 + 10;
        const sliceY = Math.random() * (canvas2d.height - sliceH);
        const shift = (Math.random() - 0.5) * 50;

        const imgData = ctx2d.getImageData(0, sliceY, canvas2d.width, sliceH);
        ctx2d.putImageData(imgData, shift, sliceY);

        ctx2d.fillStyle = 'rgba(0, 243, 255, 0.4)';
        ctx2d.fillRect(0, sliceY, canvas2d.width, 2);
      }
    }

    // ── CONTROLLER ACTIONS ─────────────────────────────────────────────────
    function setVisualMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-buttons .btn').forEach(btn => btn.classList.remove('active'));
      const buttons = Array.from(document.querySelectorAll('.mode-buttons .btn'));
      const target = buttons.find(b => b.textContent.toLowerCase().includes(mode.substring(0, 3)));
      if (target) target.classList.add('active');
      updateSceneVisibility();
    }

    function changeTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      activePalette = PALETTES[theme] || PALETTES.emerald;
      if (scene) {
        scene.background.setHex(activePalette.bg);
        scene.fog.color.setHex(activePalette.bg);
        if (starPoints) starPoints.material.color.setHex(activePalette.particles);
        if (orbGroup) {
          orbGroup.children[0].material.color.setHex(activePalette.primary);
          orbGroup.children[0].material.emissive.setHex(activePalette.primary);
          orbGroup.children[2].material.color.setHex(activePalette.primary);
          orbGroup.children[3].material.color.setHex(activePalette.secondary);
        }
      }
    }

    function updateSliders() {
      speed = document.getElementById('speedSlider').value / 10;
      document.getElementById('speedVal').innerText = speed.toFixed(1) + 'x';

      glowScale = document.getElementById('glowSlider').value / 100;
      document.getElementById('glowVal').innerText = Math.round(glowScale * 100) + '%';
      if (starPoints) starPoints.material.size = 1.5 * glowScale;
    }

    // ── DRAGGABLE HUD ──────────────────────────────────────────────────────
    const hud = document.getElementById('hudWindow');
    const header = document.getElementById('hudHeader');
    let isDragging = false, offX = 0, offY = 0;

    header.addEventListener('mousedown', (e) => {
      isDragging = true;
      offX = e.clientX - hud.offsetLeft;
      offY = e.clientY - hud.offsetTop;
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        hud.style.left = (e.clientX - offX) + 'px';
        hud.style.top = (e.clientY - offY) + 'px';
        hud.style.right = 'auto';
      }
    });

    window.addEventListener('mouseup', () => isDragging = false);

    // Initialize 3D Engine & Start Animation
    initThree();
    animate();
  </script>
</body>
</html>
