<!DOCTYPE html>
<html lang="en" data-theme="emerald">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZOTHOS // INTERACTIVE VISUAL FX ENGINE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    :root {
      --bg: #02040a;
      --accent: #00ff88;
      --accent-rgb: 0, 255, 136;
      --accent2: #00f3ff;
      --accent2-rgb: 0, 243, 255;
      --gold: #fbbf24;
      --purple: #a855f7;
      --fg: #ecfdf5;
      --card-bg: rgba(2, 8, 18, 0.88);
      --border: rgba(0, 255, 136, 0.4);
      --glow: 0 0 25px rgba(0, 255, 136, 0.5);
      --font-mono: 'JetBrains Mono', 'Share Tech Mono', 'DejaVu Sans Mono', monospace;
    }

    [data-theme="ghost"] {
      --accent: #c084fc;
      --accent-rgb: 192, 132, 252;
      --accent2: #a855f7;
      --fg: #faf5ff;
      --card-bg: rgba(12, 4, 24, 0.90);
      --border: rgba(168, 85, 247, 0.45);
      --glow: 0 0 25px rgba(168, 85, 247, 0.55);
    }

    [data-theme="gold"] {
      --accent: #fbbf24;
      --accent-rgb: 251, 191, 36;
      --accent2: #f59e0b;
      --fg: #fefce8;
      --card-bg: rgba(20, 14, 2, 0.90);
      --border: rgba(251, 191, 36, 0.45);
      --glow: 0 0 25px rgba(251, 191, 36, 0.55);
    }

    [data-theme="cyan"] {
      --accent: #00f3ff;
      --accent-rgb: 0, 243, 255;
      --accent2: #38bdf8;
      --fg: #f0fdfa;
      --card-bg: rgba(2, 14, 28, 0.90);
      --border: rgba(0, 243, 255, 0.45);
      --glow: 0 0 25px rgba(0, 243, 255, 0.55);
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font-mono);
      color: var(--fg);
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* CRT Scanline & Glitch Overlay */
    .crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 4px 100%;
    }

    /* Top Action Bar (Persistent Exit & Fullscreen) */
    .top-action-bar {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      pointer-events: auto;
    }

    .brand-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6), var(--glow);
    }

    .brand-pill .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(0.85); opacity: 0.7; }
      100% { transform: scale(1.25); opacity: 1; }
    }

    .brand-pill span {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--accent);
    }

    .exit-controls {
      display: flex;
      gap: 10px;
    }

    .btn-exit {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.6);
      color: #fca5a5;
      padding: 8px 18px;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
    }

    .btn-exit:hover {
      background: rgba(239, 68, 68, 0.9);
      color: #ffffff;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
      transform: translateY(-1px);
    }

    .btn-fullscreen {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 8px 16px;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
    }

    .btn-fullscreen:hover {
      background: var(--accent);
      color: #02040a;
      box-shadow: var(--glow);
    }

    /* Floating Draggable Control HUD */
    .hud-window {
      position: absolute;
      top: 75px;
      right: 20px;
      width: 350px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), var(--glow);
      z-index: 50;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .hud-header {
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid var(--border);
      border-radius: 12px 12px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: move;
    }

    .hud-title {
      font-size: 12px;
      font-weight: bold;
      color: var(--accent);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hud-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent2);
      margin-bottom: 4px;
    }

    .mode-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--fg);
      padding: 8px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(0, 255, 136, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn.active {
      background: var(--accent);
      color: #02040a;
      border-color: var(--accent);
      font-weight: bold;
      box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.6);
    }

    .theme-picker {
      display: flex;
      gap: 8px;
    }

    .theme-dot {
      flex: 1;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .theme-dot:hover {
      transform: scale(1.05);
      border-color: #fff;
    }

    .dot-emerald { background: #00ff88; }
    .dot-ghost { background: #c084fc; }
    .dot-gold { background: #fbbf24; }
    .dot-cyan { background: #00f3ff; }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #94a3b8;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 8px var(--accent);
    }

    .hint-bar {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 11px;
      color: #94a3b8;
      backdrop-filter: blur(12px);
      z-index: 40;
      pointer-events: none;
    }
    .hint-bar kbd {
      background: rgba(255,255,255,0.1);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Background Animated Visual Canvas -->
  <canvas id="canvas-container"></canvas>
  <div class="crt-overlay"></div>

  <!-- Persistent Top Action Bar -->
  <div class="top-action-bar">
    <div class="brand-pill">
      <div class="pulse-dot"></div>
      <span>ZOTHOS // FX ENGINE</span>
    </div>
    <div class="exit-controls">
      <button class="btn-fullscreen" onclick="toggleFullscreen()" title="Toggle Fullscreen (F)">⛶ FULLSCREEN</button>
      <button class="btn-exit" onclick="exitLiveWallpaper()" title="Exit & Return to Desktop (ESC)">✕ EXIT ENGINE [ESC]</button>
    </div>
  </div>

  <!-- Floating Draggable Control HUD -->
  <div class="hud-window" id="hudWindow">
    <div class="hud-header" id="hudHeader">
      <div class="hud-title">⚡ VISUAL FILTER & MATRIX FX</div>
      <span style="font-size: 10px; color: #94a3b8;">DRAG TO MOVE</span>
    </div>
    <div class="hud-body">
      <div>
        <div class="section-title">Visual Paradigm</div>
        <div class="mode-buttons">
          <button class="btn active" onclick="setVisualMode('matrix')">Matrix Rain</button>
          <button class="btn" onclick="setVisualMode('sacred')">Sacred Azoth</button>
          <button class="btn" onclick="setVisualMode('neural')">Neural Net</button>
          <button class="btn" onclick="setVisualMode('datamosh')">Datamosh</button>
        </div>
      </div>

      <div>
        <div class="section-title">Aura Theme</div>
        <div class="theme-picker">
          <div class="theme-dot dot-emerald" onclick="changeTheme('emerald')" title="Emerald Matrix"></div>
          <div class="theme-dot dot-ghost" onclick="changeTheme('ghost')" title="Ghost Amethyst"></div>
          <div class="theme-dot dot-gold" onclick="changeTheme('gold')" title="Celestial Gold"></div>
          <div class="theme-dot dot-cyan" onclick="changeTheme('cyan')" title="Electric Cyan"></div>
        </div>
      </div>

      <div class="slider-group">
        <div class="slider-label">
          <span>Glitch Intensity</span>
          <span id="glitchVal">25%</span>
        </div>
        <input type="range" id="glitchSlider" min="0" max="100" value="25" oninput="updateSliders()">
      </div>

      <div class="slider-group">
        <div class="slider-label">
          <span>Simulation Speed</span>
          <span id="speedVal">1.0x</span>
        </div>
        <input type="range" id="speedSlider" min="2" max="30" value="10" oninput="updateSliders()">
      </div>

      <button class="btn-exit" style="width: 100%; justify-content: center; margin-top: 4px;" onclick="exitLiveWallpaper()">
        RETURN TO DESKTOP
      </button>
    </div>
  </div>

  <!-- Bottom keyboard hints -->
  <div class="hint-bar">
    <kbd>ESC</kbd> Exit to Desktop &nbsp;•&nbsp; <kbd>SPACE</kbd> Toggle HUD &nbsp;•&nbsp; <kbd>F</kbd> Fullscreen &nbsp;•&nbsp; <kbd>1-4</kbd> Switch Mode
  </div>

  <script>
    // ── EXIT HANDLING ───────────────────────────────────────────────────────
    function exitLiveWallpaper() {
      // Clean window close / redirect or message
      if (window.opener) {
        window.close();
      } else {
        window.close();
        // Fallback for browsers preventing window.close()
        window.location.href = "about:blank";
      }
    }

    // Global Keybinds
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key === 'q' || e.key === 'Q') {
        exitLiveWallpaper();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      } else if (e.key === ' ' || e.code === 'Space') {
        toggleHud();
      } else if (e.key === '1') {
        setVisualMode('matrix');
      } else if (e.key === '2') {
        setVisualMode('sacred');
      } else if (e.key === '3') {
        setVisualMode('neural');
      } else if (e.key === '4') {
        setVisualMode('datamosh');
      }
    });

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }
    }

    function toggleHud() {
      const hud = document.getElementById('hudWindow');
      hud.style.display = hud.style.display === 'none' ? 'block' : 'none';
    }

    // ── CANVAS ENGINE ──────────────────────────────────────────────────────
    const canvas = document.getElementById('canvas-container');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let currentMode = 'matrix';
    let glitchIntensity = 0.25;
    let speed = 1.0;
    let mouse = { x: width / 2, y: height / 2, down: false };

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    window.addEventListener('mousedown', () => mouse.down = true);
    window.addEventListener('mouseup', () => mouse.down = false);

    // ── 1. MATRIX RAIN ENGINE ──────────────────────────────────────────────
    const chars = '0123456789ABCDEFѰ🜂🜄🜁🜃ZOTHOSNULLAIΩΨλπµ§±√';
    const fontSize = 16;
    let columns = Math.floor(window.innerWidth / fontSize);
    let drops = Array(columns).fill(1);

    window.addEventListener('resize', () => {
      columns = Math.floor(window.innerWidth / fontSize);
      drops = Array(columns).fill(1);
    });

    function drawMatrix() {
      ctx.fillStyle = `rgba(2, 4, 10, ${0.08 * speed})`;
      ctx.fillRect(0, 0, width, height);

      const computedStyle = getComputedStyle(document.documentElement);
      const accent = computedStyle.getPropertyValue('--accent').trim();

      ctx.fillStyle = accent;
      ctx.font = `${fontSize}px 'JetBrains Mono', monospace`;

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        // Head glyph glows brighter
        if (Math.random() > 0.85) {
          ctx.fillStyle = '#ffffff';
        } else {
          ctx.fillStyle = accent;
        }

        ctx.fillText(text, x, y);

        if (y > height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i] += speed * 0.7;
      }
    }

    // ── 2. SACRED GEOMETRY / AZOTH ENGINE ──────────────────────────────────
    let angle = 0;
    function drawSacred() {
      ctx.fillStyle = 'rgba(2, 4, 10, 0.15)';
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.translate(width / 2, height / 2);
      angle += 0.01 * speed;

      const computedStyle = getComputedStyle(document.documentElement);
      const accent = computedStyle.getPropertyValue('--accent').trim();
      const accent2 = computedStyle.getPropertyValue('--accent2').trim();

      // Outer Ring
      ctx.beginPath();
      ctx.arc(0, 0, 180 + Math.sin(angle * 2) * 10, 0, Math.PI * 2);
      ctx.strokeStyle = accent;
      ctx.lineWidth = 2;
      ctx.shadowBlur = 15;
      ctx.shadowColor = accent;
      ctx.stroke();

      // Rotating Hexagons & Triangles
      for (let k = 0; k < 3; k++) {
        ctx.save();
        ctx.rotate(angle * (k % 2 === 0 ? 1 : -1) + (k * Math.PI / 3));
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = (i * Math.PI) / 3;
          const r = 140 - k * 35;
          const x = Math.cos(a) * r;
          const y = Math.sin(a) * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.strokeStyle = k === 1 ? accent2 : accent;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
      }

      // Center Pulsing Core
      ctx.beginPath();
      ctx.arc(0, 0, 24 + Math.sin(angle * 4) * 8, 0, Math.PI * 2);
      ctx.fillStyle = accent;
      ctx.shadowBlur = 30;
      ctx.shadowColor = accent;
      ctx.fill();

      ctx.restore();
    }

    // ── 3. NEURAL NETWORK ENGINE ───────────────────────────────────────────
    const particleCount = 70;
    const particles = [];
    for (let i = 0; i < particleCount; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - 0.5) * 1.5,
        vy: (Math.random() - 0.5) * 1.5,
        size: Math.random() * 3 + 1
      });
    }

    function drawNeural() {
      ctx.fillStyle = 'rgba(2, 4, 10, 0.2)';
      ctx.fillRect(0, 0, width, height);

      const computedStyle = getComputedStyle(document.documentElement);
      const color = computedStyle.getPropertyValue('--accent').trim();

      for (let i = 0; i < particles.length; i++) {
        let p = particles[i];
        p.x += p.vx * speed;
        p.y += p.vy * speed;

        if (p.x < 0 || p.x > width) p.vx *= -1;
        if (p.y < 0 || p.y > height) p.vy *= -1;

        // Mouse attraction
        const dx = mouse.x - p.x;
        const dy = mouse.y - p.y;
        const mdist = Math.hypot(dx, dy);
        if (mdist < 200) {
          p.x += (dx / mdist) * 2;
          p.y += (dy / mdist) * 2;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();

        for (let j = i + 1; j < particles.length; j++) {
          let p2 = particles[j];
          let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
          if (dist < 150) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = `rgba(0, 255, 136, ${1 - dist / 150})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
      }
    }

    // ── 4. DATAMOSH / GLITCH ENGINE ────────────────────────────────────────
    function drawDatamosh() {
      drawMatrix();
      if (Math.random() < glitchIntensity * 0.5) {
        const sliceH = Math.random() * 40 + 10;
        const sliceY = Math.random() * (height - sliceH);
        const shift = (Math.random() - 0.5) * 50;

        const imgData = ctx.getImageData(0, sliceY, width, sliceH);
        ctx.putImageData(imgData, shift, sliceY);

        ctx.fillStyle = `rgba(0, 243, 255, 0.4)`;
        ctx.fillRect(0, sliceY, width, 2);
      }
    }

    // ── MASTER RENDER LOOP ─────────────────────────────────────────────────
    function animate() {
      switch (currentMode) {
        case 'matrix': drawMatrix(); break;
        case 'sacred': drawSacred(); break;
        case 'neural': drawNeural(); break;
        case 'datamosh': drawDatamosh(); break;
      }
      requestAnimationFrame(animate);
    }
    animate();

    // ── INTERACTIVE CONTROLS ───────────────────────────────────────────────
    function setVisualMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-buttons .btn').forEach(btn => btn.classList.remove('active'));
      const buttons = Array.from(document.querySelectorAll('.mode-buttons .btn'));
      const target = buttons.find(b => b.textContent.toLowerCase().includes(mode.substring(0, 4)));
      if (target) target.classList.add('active');
    }

    function changeTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
    }

    function updateSliders() {
      glitchIntensity = document.getElementById('glitchSlider').value / 100;
      document.getElementById('glitchVal').innerText = Math.round(glitchIntensity * 100) + '%';

      speed = document.getElementById('speedSlider').value / 10;
      document.getElementById('speedVal').innerText = speed.toFixed(1) + 'x';
    }

    // ── DRAGGABLE HUD WINDOW LOGIC ─────────────────────────────────────────
    const hud = document.getElementById('hudWindow');
    const header = document.getElementById('hudHeader');
    let isDragging = false, offX = 0, offY = 0;

    header.addEventListener('mousedown', (e) => {
      isDragging = true;
      offX = e.clientX - hud.offsetLeft;
      offY = e.clientY - hud.offsetTop;
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        hud.style.left = (e.clientX - offX) + 'px';
        hud.style.top = (e.clientY - offY) + 'px';
        hud.style.right = 'auto';
      }
    });

    window.addEventListener('mouseup', () => isDragging = false);
  </script>
</body>
</html>
