<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#04120e"/>
      <stop offset="85%" stop-color="#020705"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="50%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="goldAura" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle & Outer Ring -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="url(#neonEmerald)" stroke-width="2"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#00ff88" stroke-width="1" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- Alchemical Hexagram & Geometry -->
  <polygon points="64,18 104,88 24,88" fill="none" stroke="url(#neonEmerald)" stroke-width="1.5" opacity="0.75"/>
  <polygon points="64,110 104,40 24,40" fill="none" stroke="url(#neonEmerald)" stroke-width="1.5" opacity="0.75"/>

  <!-- Concentric Security Ring Nodes (Layers 0-4) -->
  <circle cx="64" cy="18" r="4" fill="#00f3ff" filter="url(#glow)"/>
  <circle cx="104" cy="40" r="4" fill="#00ff88" filter="url(#glow)"/>
  <circle cx="104" cy="88" r="4" fill="#10b981" filter="url(#glow)"/>
  <circle cx="64" cy="110" r="4" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="24" cy="88" r="4" fill="#ef4444" filter="url(#glow)"/>
  <circle cx="24" cy="40" r="4" fill="#fbbf24" filter="url(#glow)"/>

  <!-- Central Autonomous Agent Eye / Core -->
  <circle cx="64" cy="64" r="22" fill="#031f16" stroke="url(#goldAura)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="14" fill="#010806" stroke="url(#neonEmerald)" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="6" fill="#00ff88" filter="url(#glow)"/>
  <circle cx="67" cy="61" r="2" fill="#ffffff"/>

  <!-- Neural Crosshairs -->
  <line x1="64" y1="36" x2="64" y2="46" stroke="#00f3ff" stroke-width="1.5"/>
  <line x1="64" y1="82" x2="64" y2="92" stroke="#00f3ff" stroke-width="1.5"/>
  <line x1="36" y1="64" x2="46" y2="64" stroke="#00f3ff" stroke-width="1.5"/>
  <line x1="82" y1="64" x2="92" y2="64" stroke="#00f3ff" stroke-width="1.5"/>
</svg>
