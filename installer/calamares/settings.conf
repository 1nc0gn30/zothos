# ==============================================================================
#  CALAMARES CONFIGURATION SPECIFICATION FOR ZOTHOS LINUX
#  Sovereign Installer Settings & Module Execution Sequence
# ==============================================================================
---
# Modules search paths
modules-search:
  - local
  - /usr/lib/x86_64-linux-gnu/calamares/modules
  - /usr/lib/calamares/modules

# Module instances
instances:
  - id:       bootloader
    module:   bootloader
    config:   bootloader.conf
  - id:       grub
    module:   grub
    config:   grub.conf

# Complete installation sequence
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - packagechooser
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - services-systemd
      - grub
      - bootloader
      - umount
  - show:
      - finished

# Branding and behavior
branding: zothos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
